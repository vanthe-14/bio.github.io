<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛵ Hải trình bão tố</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#03111d}
body{font-family:Arial,sans-serif}
.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:#061522}
.ship-scene{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:center;filter:saturate(.92) contrast(1.08) brightness(.82);transform:scale(1.04) translate3d(0,0,0);animation:cameraFloat 10s ease-in-out infinite alternate}
@keyframes cameraFloat{0%{transform:scale(1.04) translate3d(-.4%,0,0)}50%{transform:scale(1.07) translate3d(.5%,-.5%,0)}100%{transform:scale(1.04) translate3d(-.2%,.4%,0)}}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 52% 40%,transparent 20%,rgba(0,10,18,.18) 62%,rgba(0,5,12,.72) 100%),linear-gradient(to bottom,rgba(0,12,25,.18),transparent 48%,rgba(0,8,18,.35))}
.lightning{position:absolute;inset:0;background:rgba(220,245,255,0);pointer-events:none;animation:flash 7s infinite}
@keyframes flash{0%,92%,95%,100%{background:rgba(220,245,255,0)}93%{background:rgba(220,245,255,.48)}94%{background:rgba(220,245,255,.08)}}
.rain{position:absolute;inset:-20%;pointer-events:none;opacity:.28;background-image:repeating-linear-gradient(105deg,transparent 0 14px,rgba(210,240,255,.45) 15px 16px,transparent 17px 28px);background-size:70px 70px;animation:rainMove .7s linear infinite}
@keyframes rainMove{to{transform:translate(-35px,70px)}}
.ocean-front{position:absolute;left:-5%;bottom:-2%;width:110%;height:34%;pointer-events:none;overflow:hidden}
.wave{position:absolute;left:-15%;width:130%;height:100px;border-radius:50% 50% 0 0;background:linear-gradient(to bottom,rgba(180,235,245,.42),rgba(5,45,65,.86));filter:blur(1px);animation:waveMove 5s linear infinite}
.wave:nth-child(1){bottom:0;height:130px;animation-duration:6s}.wave:nth-child(2){bottom:50px;height:100px;opacity:.65;animation-duration:4.5s;animation-direction:reverse}.wave:nth-child(3){bottom:105px;height:75px;opacity:.42;animation-duration:7s}
@keyframes waveMove{from{transform:translateX(-5%) rotate(0deg)}50%{transform:translateX(4%) rotate(1deg)}to{transform:translateX(-5%) rotate(0deg)}}
.foam{position:absolute;left:0;bottom:10%;width:100%;height:35%;background:radial-gradient(ellipse at 25% 70%,rgba(220,250,255,.7) 0 2%,transparent 7%),radial-gradient(ellipse at 52% 58%,rgba(220,250,255,.55) 0 2%,transparent 8%),radial-gradient(ellipse at 75% 78%,rgba(220,250,255,.65) 0 2%,transparent 9%);filter:blur(3px);animation:foamFloat 3s ease-in-out infinite alternate}
@keyframes foamFloat{from{transform:translateY(5px);opacity:.55}to{transform:translateY(-8px);opacity:.9}}
.spray{position:absolute;inset:0;pointer-events:none}
.drop{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(225,250,255,.8);animation:spray 2.2s ease-out infinite}
@keyframes spray{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.title{position:absolute;left:24px;top:24px;color:white;z-index:10;text-shadow:0 2px 12px #000}.title h1{font-size:clamp(20px,3vw,34px);letter-spacing:1px}.title p{margin-top:6px;opacity:.72;font-size:13px}
.badge{position:absolute;right:22px;top:22px;z-index:10;padding:10px 14px;border:1px solid rgba(255,255,255,.18);border-radius:14px;color:#e9fbff;background:rgba(0,15,25,.34);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
@media(max-width:600px){.ship-scene{inset:-8%;width:116%;height:116%}.ocean-front{height:30%}.title{left:14px;top:14px}.badge{right:14px;top:14px;font-size:12px}}
</style>
</head>
<body>
<div class="scene">
<img class="ship-scene" src="thuyen.jpg" alt="Tàu buồm giữa đại dương">
<div class="lightning"></div>
<div class="rain"></div>
<div class="ocean-front"><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="foam"></div></div>
<div class="spray" id="spray"></div>
<div class="vignette"></div>
<div class="title"><h1>⛵ HẢI TRÌNH BÃO TỐ</h1><p>Con tàu buồm giữa đại dương</p></div>
<div class="badge">🌊 STORM MODE</div>
</div>
<script>
const spray=document.getElementById('spray');
for(let i=0;i<35;i++){
 const d=document.createElement('span');d.className='drop';d.style.left=(30+Math.random()*45)+'%';d.style.top=(35+Math.random()*45)+'%';d.style.setProperty('--dx',(Math.random()*120-60)+'px');d.style.setProperty('--dy',(-30-Math.random()*100)+'px');d.style.animationDelay=(Math.random()*2.2)+'s';d.style.animationDuration=(1.5+Math.random()*1.8)+'s';spray.appendChild(d);
}
</script>
</body>
</html>
