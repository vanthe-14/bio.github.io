           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

                Arial,
                Helvetica,

            color: white;

           NỀN
        ===================================================== */

        .scene {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 42%,
                    rgba(255, 120, 150, .10),
                    transparent 30%

                radial-gradient(
                    circle at 50% 80%,
                    rgba(255, 50, 100, .07),
                    transparent 35%

                #030305;
        }


        /* =====================================================
           ÁNH SÁNG SAU HOA
        ===================================================== */

        .background-glow {

            position: absolute;

            width: 430px;
            height: 430px;

            left: 50%;
            top: 42%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 160, 180, .18),
                    rgba(255, 70, 120, .06) 40%,
                    transparent 72%
                );

            filter: blur(25px);

            animation:
                backgroundPulse 4s ease-in-out infinite;
        }


        @keyframes backgroundPulse {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(.9);

                opacity: .45;
            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.15);

                opacity: .9;
            }
        }


        /* =====================================================
           SAO
        ===================================================== */

        .star {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 6px white,
                0 0 12px #ff9eb4;

            opacity: .7;

            animation:
                starTwinkle var(--time) ease-in-out infinite;
        }


        @keyframes starTwinkle {

            0% {
                opacity: .15;
                transform: scale(.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }

            100% {
                opacity: .15;

            opacity: 0;

            animation:
                titleAppear 2s ease forwards;

            white-space: nowrap;

            z-index: 5;
        }


        @keyframes titleAppear {

            from {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(-15px);
            }

            to {
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(0);

        .gift {

<script>


    /* =====================================================
       HỘP QUÀ
    ===================================================== */

    const gift =
        document.getElementById("gift");


    let opened = false;


    gift.addEventListener(
        "click",
        function () {


            /* Không cho mở lại */

            if (opened) {
                return;
