<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cảm ơn bạn đã xem</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071e3d, #126e82);
            font-family: Arial, sans-serif;
        }

        .thank-you {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .thank-you img {
            width: 300px;
            max-width: 80%;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }

        .thank-you h1 {
            font-size: 42px;
            margin: 10px 0;
            text-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        .thank-you p {
            font-size: 20px;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="thank-you">

        <!-- Đổi "camon.jpg" thành tên ảnh của bạn -->
        <img src="camon.jpg" alt="Cảm ơn bạn đã xem">

        <h1>💙 Cảm ơn bạn đã xem!</h1>
        <p>Chúc bạn một ngày thật tuyệt vời ✨</p>

    </div>

</body>
</html>
