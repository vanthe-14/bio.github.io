<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rắn săn mồi - Mai Văn Thế</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;background:radial-gradient(circle at top,#122744,#050b14 55%,#000);color:#fff;font-family:Arial,sans-serif;overflow:hidden}.game{width:min(94vw,560px);padding:16px;border:1px solid rgba(0,170,255,.25);border-radius:22px;background:rgba(5,10,20,.82);backdrop-filter:blur(12px);box-shadow:0 20px 70px rgba(0,0,0,.45),0 0 30px rgba(0,140,255,.12)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:clamp(22px,5vw,32px);font-weight:800;color:#42c7ff;text-shadow:0 0 14px rgba(0,170,255,.6)}.score{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:15px}canvas{display:block;width:100%;aspect-ratio:1;border-radius:16px;background:#02050a;border:1px solid rgba(0,170,255,.2);touch-action:none}.hint{text-align:center;color:rgba(255,255,255,.65);font-size:13px;margin:10px 0}.controls{max-width:220px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.controls button,.actions button{border:1px solid rgba(0,170,255,.25);background:rgba(0,140,255,.12);color:#fff;border-radius:13px;min-height:48px;font-size:21px;font-weight:700;cursor:pointer}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.actions{display:flex;gap:8px;margin-top:9px}.actions button{flex:1;font-size:14px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.58);padding:20px}.overlay.show{display:grid}.card{width:min(90vw,350px);padding:28px;border-radius:20px;text-align:center;background:#0b1220;border:1px solid rgba(0,170,255,.25);box-shadow:0 20px 60px rgba(0,0,0,.5)}.card h2{font-size:28px;margin-bottom:8px}.card p{color:#aaa;margin-bottom:18px}.restart{width:100%;padding:13px;border:0;border-radius:13px;background:#00aaff;color:#00111a;font-weight:800;font-size:16px;cursor:pointer}@media(max-width:500px){.game{padding:11px}.hint{font-size:11px}.controls{max-width:205px}}
</style>
</head>
<body>
<div class="game"><div class="top"><div class="title">🐍 Rắn săn mồi</div><div class="score">Điểm: <b id="score">0</b></div></div><canvas id="game" width="480" height="480"></canvas><div class="hint">← ↑ ↓ → hoặc WASD để di chuyển</div><div class="controls"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="actions"><button id="pause">⏸ Tạm dừng</button><button id="back">← Trang chính</button></div></div>
<div class="overlay" id="over"><div class="card"><h2>🐍 Game Over!</h2><p>Điểm của bạn: <b id="final">0</b></p><button class="restart" id="restart">Chơi lại</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score'),finalEl=document.getElementById('final'),over=document.getElementById('over');const pauseBtn=document.getElementById('pause'),restartBtn=document.getElementById('restart'),backBtn=document.getElementById('back');const N=24,C=20;let snake,food,dir,nextDir,score,paused,ended,timer;
function reset(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;paused=false;ended=false;scoreEl.textContent=0;pauseBtn.textContent='⏸ Tạm dừng';over.classList.remove('show');placeFood();clearInterval(timer);timer=setInterval(step,115);draw()}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d||d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;if(paused&&!ended)togglePause()}
function step(){if(paused||ended)return;dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((s,i)=>i>0&&s.x===h.x&&s.y===h.y)){end();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=score;placeFood()}else snake.pop();draw()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#02050a';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(80,170,255,.055)';for(let i=1;i<N;i++){let p=i*C;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(canvas.width,p);ctx.stroke()}ctx.shadowBlur=12;ctx.shadowColor='#ff4f72';ctx.fillStyle='#ff4f72';ctx.beginPath();ctx.arc(food.x*C+10,food.y*C+10,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#00d5ff':'#00aaff';ctx.shadowBlur=i===0?12:5;ctx.shadowColor='#00aaff';roundRect(s.x*C+2,s.y*C+2,16,16,5);ctx.fill()});ctx.shadowBlur=0}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function end(){ended=true;clearInterval(timer);finalEl.textContent=score;over.classList.add('show')}
function togglePause(){if(ended)return;paused=!paused;pauseBtn.textContent=paused?'▶ Tiếp tục':'⏸ Tạm dừng'}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));pauseBtn.addEventListener('click',togglePause);restartBtn.addEventListener('click',reset);backBtn.addEventListener('click',()=>location.href='index.html');document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}else if(e.key===' '){e.preventDefault();togglePause()}});
let touchStart=null;canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up');touchStart=null},{passive:true});reset();
</script>
</body>
</html>
