<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>🌸 Surprise Flower</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffb6c9;
        }


        /* =====================================================
           NỀN HỒNG
        ===================================================== */

        .scene {

            position: fixed;

            inset: 0;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    #ffdce6 0%,
                    #ffc2d3 25%,
                    #ff9fbb 55%,
                    #f77d9f 100%
                );
        }


        /* ÁNH SÁNG GIỮA MÀN HÌNH */

        .background-glow {

            position: absolute;

            left: 50%;
            top: 45%;

            width: 500px;
            height: 500px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255,255,255,.65),
                    rgba(255,180,205,.25) 40%,
                    transparent 70%
                );

            filter: blur(25px);

            animation:
                glowMove 4s ease-in-out infinite;
        }


        @keyframes glowMove {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(.9);

                opacity: .7;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.15);

                opacity: 1;
            }
        }


        /* =====================================================
           HẠT SÁNG
        ===================================================== */

        .sparkle {

            position: absolute;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: white;

            box-shadow:

                0 0 6px white,

                0 0 14px #ff5f91,

                0 0 25px #ff5f91;

            animation:
                sparkleMove
                var(--time)
                ease-in-out
                infinite;
        }


        @keyframes sparkleMove {

            0% {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.3);
            }

            40% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translateY(-80px)
                    scale(.2);
            }
        }


        /* =====================================================
           KHU VỰC TRUNG TÂM
        ===================================================== */

        .center {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 360px;
            height: 500px;

            transform:
                translate(-50%, -50%);

            display: flex;

            align-items: center;

            justify-content: flex-end;

            flex-direction: column;
        }


        /* =====================================================
           HỘP QUÀ
        ===================================================== */

        .gift {

            position: absolute;

            left: 50%;
            bottom: 80px;

            width: 180px;
            height: 145px;

            transform:
                translateX(-50%);

            z-index: 10;

            animation:
                giftDisappear
                1s
                ease
                5.2s
                forwards;
        }


        /* THÂN HỘP */

        .gift-box {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 180px;
            height: 115px;

            border-radius:
                8px 8px 15px 15px;

            background:

                linear-gradient(
                    90deg,
                    #e83f70,
                    #ff7098 45%,
                    #e83f70
                );

            box-shadow:

                0 12px 25px
                rgba(150,30,70,.35);
        }


        /* DẢI DỌC */

        .gift-box::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            width: 27px;
            height: 100%;

            transform:
                translateX(-50%);

            background:
                #ffd76e;
        }


        /* NẮP */

        .gift-lid {

            position: absolute;

            left: -10px;
            top: -28px;

            width: 200px;
            height: 38px;

            border-radius: 8px;

            background:

                linear-gradient(
                    90deg,
                    #d92d61,
                    #ff6d96,
                    #d92d61
                );

            z-index: 5;

            animation:
                lidOpen
                1.2s
                cubic-bezier(.2,.8,.2,1)
                1.3s
                forwards;
        }


        /* DẢI TRÊN NẮP */

        .gift-lid::after {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            width: 27px;
            height: 100%;

            transform:
                translateX(-50%);

            background:
                #ffd76e;
        }


        /* =====================================================
           NƠ
        ===================================================== */

        .bow {

            position: absolute;

            left: 50%;
            top: -58px;

            width: 75px;
            height: 55px;

            transform:
                translateX(-50%);

            z-index: 20;

            animation:
                bowOpen
                1s
                ease
                1.2s
                forwards;
        }


        .bow-left,
        .bow-right {

            position: absolute;

            top: 8px;

            width: 42px;
            height: 35px;

            background:
                #ffd76e;

            border-radius:
                70% 20% 70% 20%;
        }


        .bow-left {

            left: 0;

            transform:
                rotate(-25deg);
        }


        .bow-right {

            right: 0;

            transform:
                rotate(25deg);
        }


        .bow-center {

            position: absolute;

            left: 50%;
            top: 13px;

            width: 25px;
            height: 25px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                #ffed9c;
        }


        /* =====================================================
           NẮP MỞ
        ===================================================== */

        @keyframes lidOpen {

            0% {

                transform:
                    translateY(0)
                    rotate(0);
            }

            100% {

                transform:
                    translateY(-100px)
                    rotate(-18deg);

                opacity: 0;
            }
        }


        @keyframes bowOpen {

            0% {

                transform:
                    translateX(-50%)
                    scale(1);
            }

            100% {

                transform:
                    translateX(-50%)
                    translateY(-90px)
                    scale(.5);

                opacity: 0;
            }
        }


        /* =====================================================
           HỘP BIẾN MẤT
        ===================================================== */

        @keyframes giftDisappear {

            0% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    scale(1);
            }

            70% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    scale(.8);

                visibility: hidden;
            }
        }


        /* =====================================================
           HOA
        ===================================================== */

        .flower {

            position: absolute;

            left: 50%;

            bottom: 80px;

            width: 250px;
            height: 430px;

            transform:
                translateX(-50%)
                translateY(180px)
                scale(.2);

            opacity: 0;

            z-index: 5;

            animation:
                flowerGrow
                3.5s
                cubic-bezier(.2,.8,.2,1)
                1.2s
                forwards,

                flowerFloat
                4s
                ease-in-out
                5s
                infinite;
        }


        @keyframes flowerGrow {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(180px)
                    scale(.2);
            }

            60% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(-20px)
                    scale(1.05);
            }

            100% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes flowerFloat {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    translateY(0)
                    rotate(-1deg);
            }

            50% {

                transform:
                    translateX(-50%)
                    translateY(-8px)
                    rotate(1deg);
            }
        }


        /* =====================================================
           SVG
        ===================================================== */

        .flower svg {

            width: 100%;
            height: 100%;

            overflow: visible;
        }


        /* =====================================================
           THÂN
        ===================================================== */

        .stem {

            fill: none;

            stroke:
                #5f9b58;

            stroke-width: 7;

            stroke-linecap: round;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(70,150,70,.6)
                );

            stroke-dasharray: 700;

            stroke-dashoffset: 700;

            animation:
                drawStem
                2.5s
                ease
                1.5s
                forwards;
        }


        @keyframes drawStem {

            to {

                stroke-dashoffset: 0;
            }
        }


        /* =====================================================
           LÁ
        ===================================================== */

        .leaf {

            fill:
                #70a866;

            stroke:
                #b9e6ae;

            stroke-width: 2;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(80,160,80,.6)
                );

            transform-box:
                fill-box;

            transform-origin:
                center;

            animation:
                leafMove
                4s
                ease-in-out
                infinite;
        }


        @keyframes leafMove {

            0%,
            100% {

                transform:
                    rotate(0deg);
            }

            50% {

                transform:
                    rotate(4deg);
            }
        }


        /* =====================================================
           CÁNH HOA
        ===================================================== */

        .petal {

            fill:
                url(#petalGradient);

            stroke:
                rgba(255,255,255,.8);

            stroke-width: 1.5;

            filter:
                url(#flowerGlow);

            transform-box:
                fill-box;

            transform-origin:
                center;

            opacity: 0;

            animation:
                petalOpen
                1.5s
                ease
                var(--delay)
                forwards;
        }


        @keyframes petalOpen {

            from {

                opacity: 0;

                transform:
                    scale(.2)
                    rotate(-20deg);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);
            }
        }


        /* =====================================================
           NHỤY HOA
        ===================================================== */

        .flower-center {

            fill:
                #ffe3a5;

            filter:
                drop-shadow(
                    0 0 7px
                    #fff1b0
                );

            animation:
                centerPulse
                2s
                ease-in-out
                infinite;
        }


        @keyframes centerPulse {

            0%,
            100% {
                transform:
                    scale(1);
            }

            50% {
                transform:
                    scale(1.1);
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .center {

                width: 300px;
                height: 470px;
            }

            .flower {

                width: 220px;
                height: 390px;
            }

            .gift {

                transform:
                    translateX(-50%)
                    scale(.85);
            }

            .gift-lid {

                transform-origin:
                    left center;
            }

            .background-glow {

                width: 350px;
                height: 350px;
            }
        }

    </style>

</head>
