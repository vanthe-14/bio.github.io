<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mai Văn Thế</title>

<style>

/* ================================================= */
/*                    CƠ BẢN                         */
/* ================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* ================================================= */
/*                    NỀN SAO                        */
/* ================================================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    z-index: -10;

    background-color: #000;

    background-image:
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 1.5px, transparent 2.5px),
        radial-gradient(circle, white 1px, transparent 2px);

    background-size:
        90px 90px,
        140px 140px,
        200px 200px,
        270px 270px;

    background-position:
        10px 20px,
        50px 80px,
        100px 30px,
        150px 120px;

    animation: starsMove 30s linear infinite;
}


@keyframes starsMove {

    from {
        background-position:
            10px 20px,
            50px 80px,
            100px 30px,
            150px 120px;
    }

    to {
        background-position:
            100px 120px,
            150px 180px,
            200px 100px,
            250px 220px;
    }
}


/* ================================================= */
/*                    CONTAINER                      */
/* ================================================= */

.container {
    width: 100%;

    max-width: 720px;

    min-height: 100vh;

    margin: auto;

    padding: 30px 25px 70px;
}


/* ================================================= */
/*                    NÚT TRÊN                       */
/* ================================================= */

.top {
    display: flex;

    gap: 12px;

    margin-bottom: 90px;
}


.top button {
    width: 60px;
    height: 60px;

    border: none;

    border-radius: 16px;

    background: rgba(15,15,15,0.9);

    color: white;

    font-size: 28px;

    cursor: pointer;

    transition: 0.2s;
}


.top button:hover {
    transform: scale(1.06);

    background: #181818;
}


/* ================================================= */
/*                    PROFILE                        */
/* ================================================= */

.profile {
    display: flex;

    align-items: center;

    gap: 25px;

    margin-bottom: 30px;
}


/* ================================================= */
/*                    AVATAR                         */
/* ================================================= */

.avatar {
    width: 180px;
    height: 180px;

    flex-shrink: 0;

    display: block;

    object-fit: cover;

    border-radius: 35px;

    background: #111;

    box-shadow:
        0 0 12px #008cff,
        0 0 30px #008cff,
        0 0 60px rgba(0,140,255,0.5);
}


/* ================================================= */
/*                    THÔNG TIN                      */
/* ================================================= */

.info {
    flex: 1;
}


.name {
    font-size: 50px;

    font-weight: bold;

    line-height: 1.05;

    color: #00aaff;

    margin-bottom: 18px;

    text-shadow:
        0 0 8px #0088ff,
        0 0 20px #0088ff,
        0 0 35px rgba(0,136,255,0.8);
}


.bio {
    color: #999;

    font-size: 20px;

    line-height: 1.5;

    font-style: italic;
}


/* ================================================= */
/*                    DISCORD                        */
/* ================================================= */

.discord {
    display: flex;

    justify-content: center;

    margin: 25px 0;
}


.discord-icon {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: white;

    color: #555;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 27px;

    box-shadow:
        0 0 18px rgba(255,255,255,0.3);
}


/* ================================================= */
/*                    STATS                          */
/* ================================================= */

.stats {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 14px;

    margin-bottom: 60px;

    font-size: 18px;

    color: #00aaff;
}


.separator {
    color: #777;
}


/* ================================================= */
/*                    MUSIC                          */
/* ================================================= */

.song-title {
    font-size: 29px;

    margin-bottom: 16px;
}


.music-controls {
    display: flex;

    align-items: center;

    gap: 10px;
}


.time {
    width: 38px;

    flex-shrink: 0;

    text-align: center;

    font-size: 14px;

    color: white;
}


.progress {
    flex: 1;

    height: 8px;

    background: #777;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;
}


.progress-bar {
    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;

    transition: width 0.1s linear;
}


.buttons {
    display: flex;

    align-items: center;

    gap: 8px;
}


.music-btn {
    width: 40px;
    height: 40px;

    border: none;

    background: transparent;

    color: white;

    font-size: 23px;

    cursor: pointer;
}


.play-btn {
    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 22px;

    cursor: pointer;

    transition: 0.2s;
}


.play-btn:hover {
    transform: scale(1.08);
}


/* ================================================= */
/*              KHU VỰC THUYỀN + BIỂN               */
/* ================================================= */

.ocean {

    position: relative;

    width: 100%;

    height: 370px;

    margin-top: 45px;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0,50,100,0.05) 25%,
            rgba(0,80,140,0.16) 55%,
            rgba(0,100,180,0.28) 100%
        );

}


/* ================================================= */
/*              ÁNH SÁNG TRÊN MẶT NƯỚC              */
/* ================================================= */

.moon-light {

    position: absolute;

    left: 50%;

    top: 40px;

    transform: translateX(-50%);

    width: 300px;

    height: 90px;

    background:
        rgba(0,140,255,0.13);

    filter: blur(28px);

    border-radius: 50%;

}


/* ================================================= */
/*              THUYỀN ĐANG LƯỚT                    */
/* ================================================= */

.sailing-boat {

    position: absolute;

    left: 50%;

    bottom: 150px;

    width: 410px;

    height: 270px;

    transform:
        translateX(-50%)
        rotate(-2deg);

    animation:
        boatFloat 4s ease-in-out infinite;

    z-index: 5;
}


/* ================================================= */
/*              THUYỀN NHẤP NHÔ                     */
/* ================================================= */

@keyframes boatFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            rotate(-2deg);

    }

    50% {

        transform:
            translateX(-50%)
            translateY(8px)
            rotate(1deg);

    }

    100% {

        transform:
            translateX(-50%)
            translateY(0)
            rotate(-2deg);

    }
}


/* ================================================= */
/*                    THÂN THUYỀN                   */
/* ================================================= */

.boat-hull {

    position: absolute;

    left: 20px;

    bottom: 5px;

    width: 370px;

    height: 70px;

    background:
        linear-gradient(
            to bottom,
            #444 0%,
            #222 40%,
            #080808 100%
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            82% 100%,
            15% 100%
        );

    border-bottom:
        4px solid #008cff;

    box-shadow:
        0 0 12px #008cff,
        0 0 25px rgba(0,140,255,0.7);
}


/* ================================================= */
/*                    CABIN                          */
/* ================================================= */

.boat-cabin {

    position: absolute;

    left: 160px;

    bottom: 60px;

    width: 95px;

    height: 45px;

    background:
        linear-gradient(
            to bottom,
            #333,
            #111
        );

    border-top:
        3px solid #00aaff;

    border-radius:
        10px 10px 0 0;

    box-shadow:
        0 0 12px rgba(0,140,255,0.5);
}


/* CỬA SỔ CABIN */

.boat-cabin::after {

    content: "";

    position: absolute;

    left: 25px;

    top: 10px;

    width: 45px;

    height: 21px;

    background: #008cff;

    opacity: 0.7;

    box-shadow:
        0 0 12px #008cff;

}


/* ================================================= */
/*                    CỘT BUỒM                      */
/* ================================================= */

.boat-mast {

    position: absolute;

    left: 200px;

    bottom: 58px;

    width: 7px;

    height: 210px;

    background:
        linear-gradient(
            to right,
            #444,
            #fff,
            #555
        );

    border-radius: 5px;

    box-shadow:
        0 0 8px white,
        0 0 15px rgba(255,255,255,0.5);
}


/* ================================================= */
/*                    BUỒM LỚN                      */
/* ================================================= */

.main-sail {

    position: absolute;

    left: 70px;

    bottom: 88px;

    width: 0;

    height: 0;

    border-right:
        135px solid transparent;

    border-bottom:
        175px solid #f5f5f5;

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,255,255,0.5)
        );
}


/* ================================================= */
/*                    BUỒM NHỎ                      */
/* ================================================= */

.small-sail {

    position: absolute;

    left: 207px;

    bottom: 98px;

    width: 0;

    height: 0;

    border-left:
        95px solid transparent;

    border-bottom:
        130px solid #777;

    filter:
        drop-shadow(
            0 0 12px
            rgba(0,140,255,0.5)
        );
}


/* ================================================= */
/*                      CỜ                          */
/* ================================================= */

.boat-flag {

    position: absolute;

    left: 207px;

    top: 0;

    width: 0;

    height: 0;

    border-top:
        13px solid transparent;

    border-bottom:
        13px solid transparent;

    border-left:
        45px solid #00aaff;

    filter:
        drop-shadow(
            0 0 8px #008cff
        );
}


/* ================================================= */
/*                    MẶT NƯỚC                      */
/* ================================================= */

.ocean::before {

    content: "";

    position: absolute;

    left: -10%;

    bottom: 25px;

    width: 120%;

    height: 170px;

    background:
        repeating-linear-gradient(
            -5deg,
            transparent 0px,
            transparent 14px,
            rgba(0,140,255,0.35) 15px,
            transparent 18px
        );

    opacity: 0.8;

    animation:
        waterMove 6s linear infinite;

}


@keyframes waterMove {

    from {
        transform:
            translateX(0);
    }

    to {
        transform:
            translateX(-90px);
    }

}


/* ================================================= */
/*                    SÓNG                          */
/* ================================================= */

.water-wave {

    position: absolute;

    height: 15px;

    border-top:
        3px solid #008cff;

    border-radius: 50%;

    filter:
        drop-shadow(
            0 0 6px #008cff
        );

    z-index: 8;

    animation:
        waveMove 3s ease-in-out infinite;
}


.wave-a {

    width: 170px;

    left: 2%;

    bottom: 85px;

}


.wave-b {

    width: 220px;

    left: 27%;

    bottom: 105px;

    animation-delay:
        0.5s;
}


.wave-c {

    width: 180px;

    right: 0%;

    bottom: 75px;

    animation-delay:
        1s;
}


.wave-d {

    width: 140px;

    left: 50%;

    bottom: 48px;

    animation-delay:
        1.5s;
}


@keyframes waveMove {

    0% {

        transform:
            translateX(-25px)
            scaleX(0.9);

    }

    50% {

        transform:
            translateX(25px)
            scaleX(1.1);

    }

    100% {

        transform:
            translateX(-25px)
            scaleX(0.9);

    }

}


/* ================================================= */
/*                    MOBILE                         */
/* ================================================= */

@media (max-width: 600px) {

    .container {

        padding:
            25px 18px 50px;

    }


    .top {

        margin-bottom:
            70px;

    }


    .top button {

        width: 55px;

        height: 55px;

        font-size: 25px;

    }


    .profile {

        gap: 15px;

    }


    .avatar {

        width: 125px;

        height: 125px;

        border-radius: 28px;

    }


    .name {

        font-size: 35px;

    }


    .bio {

        font-size: 15px;

    }


    .stats {

        font-size: 15px;

        gap: 8px;

        margin-bottom:
            50px;

    }


    .song-title {

        font-size: 25px;

    }


    .music-controls {

        gap: 5px;

    }


    .time {

        width: 32px;

        font-size: 12px;

    }


    .music-btn {

        width: 32px;

        font-size: 18px;

    }


    .play-btn {

        width: 50px;

        height: 50px;

        font-size: 19px;

    }


    /* THUYỀN MOBILE */

    .ocean {

        height: 290px;

        margin-top: 35px;

    }


    .sailing-boat {

        width: 315px;

        height: 210px;

        bottom: 115px;

    }


    .boat-hull {

        width: 285px;

        height: 53px;

        left: 15px;

    }


    .boat-mast {

        left: 153px;

        height: 160px;

        bottom: 45px;

    }


    .main-sail {

        left: 45px;

        bottom: 65px;

        border-right-width:
            103px;

        border-bottom-width:
            132px;

    }


    .small-sail {

        left: 158px;

        bottom: 70px;

        border-left-width:
            72px;

        border-bottom-width:
            100px;

    }


    .boat-flag {

        left: 160px;

    }


    .boat-cabin {

        left: 122px;

        bottom: 45px;

        width: 76px;

        height: 35px;

    }


    .wave-a {

        bottom: 65px;

    }


    .wave-b {

        bottom: 85px;

    }


    .wave-c {

        bottom: 55px;

    }


    .wave-d {

        bottom: 35px;

    }

}


/* ================================================= */
/*                 ĐIỆN THOẠI NHỎ                   */
/* ================================================= */

@media (max-width: 420px) {

    .avatar {

        width: 105px;

        height: 105px;

    }


    .name {

        font-size: 30px;

    }


    .bio {

        font-size: 13px;

    }


    .ocean {

        height: 250px;

    }


    .sailing-boat {

        transform:
            translateX(-50%)
            scale(0.82);

    }

}

</style>
</head>


<body>


<div class="container">


    <!-- ================================================= -->
    <!--                    NÚT TRÊN                        -->
    <!-- ================================================= -->

    <div class="top">

        <button
            id="volumeBtn"
            onclick="toggleMusic()">

            🔊

        </button>


        <button
            onclick="likeProfile()">

            ♥

        </button>

    </div>



    <!-- ================================================= -->
    <!--                    PROFILE                         -->
    <!-- ================================================= -->

    <div class="profile">


        <img
            class="avatar"
            src="https://raw.githubusercontent.com/vanthe-14/vanthe.github.io/main/avatar.jpeg"
            alt="Mai Văn Thế"
        >


        <div class="info">


            <div class="name">

                Mai Văn Thế

            </div>


            <div class="bio">

                Between her and money, I choose money!

            </div>


        </div>


    </div>



    <!-- ================================================= -->
    <!--                    DISCORD                         -->
    <!-- ================================================= -->

    <div class="discord">

        <div class="discord-icon">

            ☯

        </div>

    </div>



    <!-- ================================================= -->
    <!--                    THỐNG KÊ                       -->
    <!-- ================================================= -->

    <div class="stats">


        <b>

            ♥
            <span id="likes">
                1
            </span>

        </b>


        <span class="separator">
            |
        </span>


        <b>

            ◉ 87

        </b>


        <span class="separator">
            |
        </span>


        <b>

            Hà Nội

        </b>


    </div>



    <!-- ================================================= -->
    <!--                    NHẠC                           -->
    <!-- ================================================= -->

    <div class="song-title">

        Promise

    </div>



    <div class="music-controls">


        <span
            class="time"
            id="currentTime">

            0:00

        </span>



        <div
            class="progress"
            onclick="seekMusic(event)">


            <div
                class="progress-bar"
                id="progressBar">
            </div>


        </div>



        <span
            class="time"
            id="duration">

            0:00

        </span>



        <div class="buttons">


            <button
                class="music-btn"
                onclick="previousSong()">

                ⏮

            </button>



            <button
                class="play-btn"
                id="playBtn"
                onclick="toggleMusic()">

                ▶

            </button>



            <button
                class="music-btn"
                onclick="nextSong()">

                ⏭

            </button>


        </div>


    </div>



    <!-- ================================================= -->
    <!--              THUYỀN ĐANG BƠI                     -->
    <!-- ================================================= -->

    <div class="ocean">


        <!-- Ánh sáng trên nước -->

        <div class="moon-light"></div>



        <!-- THUYỀN -->

        <div class="sailing-boat">


            <!-- CỜ -->

            <div class="boat-flag"></div>


            <!-- BUỒM LỚN -->

            <div class="main-sail"></div>


            <!-- BUỒM NHỎ -->

            <div class="small-sail"></div>


            <!-- CỘT BUỒM -->

            <div class="boat-mast"></div>


            <!-- CABIN -->

            <div class="boat-cabin"></div>


            <!-- THÂN THUYỀN -->

            <div class="boat-hull"></div>


        </div>



        <!-- SÓNG -->

        <div class="water-wave wave-a"></div>

        <div class="water-wave wave-b"></div>

        <div class="water-wave wave-c"></div>

        <div class="water-wave wave-d"></div>


    </div>


</div>



<!-- ================================================= -->
<!--                    AUDIO                           -->
<!-- ================================================= -->

<audio
    id="audio"
    src="Promise.mp3">
</audio>



<script>


/* ================================================= */
/*                    AUDIO                           */
/* ================================================= */

const audio =
    document.getElementById(
        "audio"
    );


const playBtn =
    document.getElementById(
        "playBtn"
    );


const volumeBtn =
    document.getElementById(
        "volumeBtn"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const currentTime =
    document.getElementById(
        "currentTime"
    );


const duration =
    document.getElementById(
        "duration"
    );



/* ================================================= */
/*                PLAY / PAUSE                       */
/* ================================================= */

function toggleMusic() {


    if (audio.paused) {


        audio.play();


        playBtn.innerHTML =
            "Ⅱ";


        volumeBtn.innerHTML =
            "🔊";


    } else {


        audio.pause();


        playBtn.innerHTML =
            "▶";


        volumeBtn.innerHTML =
            "🔇";

    }

}



/* ================================================= */
/*                LOAD AUDIO                         */
/* ================================================= */

audio.addEventListener(
    "loadedmetadata",
    function() {


        duration.innerHTML =
            formatTime(
                audio.duration
            );


    }
);



/* ================================================= */
/*                CẬP NHẬT NHẠC                     */
/* ================================================= */

audio.addEventListener(
    "timeupdate",
    function() {


        if (!audio.duration) {

            return;

        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.style.width =
            percent + "%";


        currentTime.innerHTML =
            formatTime(
                audio.currentTime
            );


    }
);



/* ================================================= */
/*                KẾT THÚC NHẠC                     */
/* ================================================= */

audio.addEventListener(
    "ended",
    function() {


        playBtn.innerHTML =
            "▶";


        volumeBtn.innerHTML =
            "🔊";


        progressBar.style.width =
            "0%";


        currentTime.innerHTML =
            "0:00";


    }
);



/* ================================================= */
/*                TUA NHẠC                           */
/* ================================================= */

function seekMusic(event) {


    if (!audio.duration) {

        return;

    }


    const rect =
        event.currentTarget
        .getBoundingClientRect();


    const position =
        event.clientX -
        rect.left;


    const percent =
        position /
        rect.width;


    audio.currentTime =
        percent *
        audio.duration;

}



/* ================================================= */
/*                BÀI TRƯỚC                         */
/* ================================================= */

function previousSong() {

    audio.currentTime = 0;

}



/* ================================================= */
/*                BÀI TIẾP                          */
/* ================================================= */

function nextSong() {


    audio.currentTime = 0;


    audio.play();


    playBtn.innerHTML =
        "Ⅱ";


    volumeBtn.innerHTML =
        "🔊";

}



/* ================================================= */
/*                ĐỔI THỜI GIAN                     */
/* ================================================= */

function formatTime(seconds) {


    if (isNaN(seconds)) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsLeft =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        secondsLeft
    );

}



/* ================================================= */
/*                    LIKE                           */
/* ================================================= */

function likeProfile() {


    const likes =
        document.getElementById(
            "likes"
        );


    likes.innerHTML =
        parseInt(
            likes.innerHTML
        ) + 1;

}

</script>


</body>
</html>
