<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mai Văn Thế</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* ================= NỀN SAO ================= */

.stars,
.stars::before,
.stars::after {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    content: "";
}

.stars {
    background-image:
        radial-gradient(circle, #fff 1px, transparent 1.5px),
        radial-gradient(circle, #fff 1px, transparent 1.5px),
        radial-gradient(circle, #fff 2px, transparent 2.5px);
    background-size:
        90px 90px,
        140px 140px,
        220px 220px;
    background-position:
        10px 20px,
        40px 80px,
        100px 30px;
    opacity: .85;
}

.stars::before {
    background-image:
        radial-gradient(circle, #fff 1px, transparent 2px),
        radial-gradient(circle, #fff 1px, transparent 2px);
    background-size:
        170px 170px,
        250px 250px;
    background-position:
        60px 20px,
        120px 100px;
    animation: moveStars 30s linear infinite;
}

@keyframes moveStars {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(120px);
    }
}

/* ================= CONTAINER ================= */

.container {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    margin: auto;
    padding: 28px 24px 60px;
}

/* ================= NÚT TRÊN ================= */

.top-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 100px;
}

.top-btn {
    width: 60px;
    height: 60px;

    border: none;
    border-radius: 16px;

    background: rgba(12, 12, 12, .9);

    color: white;
    font-size: 28px;

    cursor: pointer;

    transition: .2s;
}

.top-btn:hover {
    background: #181818;
    transform: scale(1.05);
}

/* ================= PROFILE ================= */

.profile {
    width: 100%;
    margin-bottom: 25px;
}

.info {
    width: 100%;
}

.name {
    color: #00aaff;

    font-size: 54px;
    font-weight: 700;

    text-shadow:
        0 0 8px #0088ff,
        0 0 20px #0088ff,
        0 0 35px rgba(0, 136, 255, .7);

    margin-bottom: 16px;
}

.bio {
    color: #999;

    font-size: 20px;
    line-height: 1.45;

    font-style: italic;
}

/* ================= DISCORD ================= */

.discord {
    display: flex;
    justify-content: center;

    margin-top: 28px;
    margin-bottom: 24px;
}

.discord-icon {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff;
    color: #555;

    border-radius: 50%;

    font-size: 28px;

    box-shadow: 0 0 18px rgba(255,255,255,.25);
}

/* ================= THÔNG TIN ================= */

.stats {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 14px;

    margin-bottom: 60px;

    color: #00aaff;

    font-size: 18px;
}

.stats .separator {
    color: #777;
}

.stats .location {
    color: #00aaff;
}

/* ================= MUSIC ================= */

.music-box {
    width: 100%;
}

.song-title {
    font-size: 29px;
    font-weight: 500;

    margin-bottom: 16px;
}

.music-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.time {
    width: 38px;

    font-size: 14px;
    color: #eee;

    text-align: center;
}

.progress-container {
    flex: 1;

    height: 9px;

    background: #777;

    border-radius: 20px;

    cursor: pointer;

    position: relative;
}

.progress-bar {
    position: absolute;

    left: 0;
    top: 0;

    width: 0%;
    height: 100%;

    background: #fff;

    border-radius: 20px;
}

.music-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.music-btn {
    width: 40px;
    height: 40px;

    border: none;
    background: transparent;

    color: white;

    font-size: 24px;

    cursor: pointer;
}

.play-btn {
    width: 58px;
    height: 58px;

    border: none;
    border-radius: 50%;

    background: #fff;
    color: #000;

    font-size: 22px;

    cursor: pointer;

    transition: .2s;
}

.play-btn:hover {
    transform: scale(1.08);
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .container {
        padding: 22px 20px 50px;
    }

    .top-buttons {
        margin-bottom: 90px;
    }

    .top-btn {
        width: 56px;
        height: 56px;
    }

    .name {
        font-size: 42px;
    }

    .bio {
        font-size: 16px;
    }

    .discord {
        margin-top: 24px;
    }

    .stats {
        font-size: 16px;
        gap: 9px;
        margin-bottom: 50px;
    }

    .song-title {
        font-size: 25px;
    }

    .music-controls {
        gap: 6px;
    }

    .music-btn {
        width: 32px;
        font-size: 20px;
    }

    .play-btn {
        width: 52px;
        height: 52px;
    }
}

@media (max-width: 420px) {

    .name {
        font-size: 36px;
    }

    .bio {
        font-size: 14px;
    }

    .stats {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

    <!-- NÚT TRÊN -->

    <div class="top-buttons">

        <button
            class="top-btn"
            id="volumeBtn"
            onclick="toggleMusic()">
            🔊
        </button>

        <button
            class="top-btn"
            onclick="likeProfile()">
            ♥
        </button>

    </div>


    <!-- TÊN -->

    <div class="profile">

        <div class="info">

            <div class="name">
                Mai Văn Thế
            </div>

            <div class="bio">
                Between her and money, I choose money!
            </div>

        </div>

    </div>


    <!-- DISCORD -->

    <div class="discord">

        <div class="discord-icon">
            ☯
        </div>

    </div>


    <!-- THÔNG TIN -->

    <div class="stats">

        <b>
            ♥ <span id="likes">10000</span>
        </b>

        <span class="separator">|</span>

        <b>
            14/3
        </b>

        <span class="separator">|</span>

        <b class="location">
            Hà Nội
        </b>

    </div>


    <!-- NHẠC -->

    <div class="music-box">

        <div class="song-title">
            Promise
        </div>

        <div class="music-controls">

            <span
                class="time"
                id="currentTime">
                0:00
            </span>

            <div
                class="progress-container"
                onclick="seekMusic(event)">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>

            <span
                class="time"
                id="duration">
                0:00
            </span>

            <div class="music-buttons">

                <button
                    class="music-btn"
                    onclick="previousSong()">
                    ⏮
                </button>

                <button
                    class="play-btn"
                    id="playBtn"
                    onclick="toggleMusic()">
                    ▶
                </button>

                <button
                    class="music-btn"
                    onclick="nextSong()">
                    ⏭
                </button>

            </div>

        </div>

    </div>

</div>


<!-- NHẠC -->

<audio id="audio" src="Promise.mp3"></audio>


<script>

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const volumeBtn =
    document.getElementById("volumeBtn");

const progressBar =
    document.getElementById("progressBar");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");


function toggleMusic() {

    if (audio.paused) {

        audio.play();

        playBtn.innerHTML = "Ⅱ";

        volumeBtn.innerHTML = "🔊";

    } else {

        audio.pause();

        playBtn.innerHTML = "▶";

        volumeBtn.innerHTML = "🔇";

    }

}


audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.innerHTML =
            formatTime(audio.duration);

    }
);


audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) return;

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progressBar.style.width =
            percent + "%";

        currentTime.innerHTML =
            formatTime(audio.currentTime);

    }
);


audio.addEventListener(
    "ended",
    function() {

        playBtn.innerHTML = "▶";

        volumeBtn.innerHTML = "🔊";

        progressBar.style.width = "0%";

        currentTime.innerHTML = "0:00";

    }
);


function seekMusic(event) {

    if (!audio.duration) return;

    const rect =
        event.currentTarget.getBoundingClientRect();

    const position =
        event.clientX - rect.left;

    const percent =
        position / rect.width;

    audio.currentTime =
        percent * audio.duration;

}


function previousSong() {

    audio.currentTime = 0;

}


function nextSong() {

    audio.currentTime = 0;

    audio.play();

    playBtn.innerHTML = "Ⅱ";

    volumeBtn.innerHTML = "🔊";

}


function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsLeft =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + secondsLeft;

}


function likeProfile() {

    const likes =
        document.getElementById("likes");

    let number =
        parseInt(likes.innerText);

    number++;

    likes.innerText = number;

}

</script>

</body>
</html>
