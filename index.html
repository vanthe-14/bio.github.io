<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mai Văn Thế</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   SAO 3D
===================================================== */

#starfield {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: -10;

    background: #000;

    pointer-events: none;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    position: relative;

    width: 100%;

    max-width: 720px;

    min-height: 100vh;

    margin: auto;

    padding:
        30px 25px 50px;

    z-index: 2;
}


/* =====================================================
   NÚT TRÊN
===================================================== */

.top {

    display: flex;

    gap: 12px;

    margin-bottom: 75px;
}


.top button {

    width: 60px;

    height: 60px;

    border: none;

    border-radius: 16px;

    background:
        rgba(15,15,15,.92);

    color: white;

    font-size: 27px;

    cursor: pointer;

    transition: .2s;
}


.top button:hover {

    transform:
        scale(1.06);

    background:
        rgba(30,30,30,.95);
}


/* =====================================================
   PROFILE
===================================================== */

.profile {

    display: flex;

    align-items: center;

    gap: 24px;

    margin-bottom: 25px;
}


/* =====================================================
   AVATAR
===================================================== */

.avatar {

    width: 180px;

    height: 180px;

    flex-shrink: 0;

    display: block;

    object-fit: cover;

    border-radius: 35px;

    background: #111;

    box-shadow:

        0 0 12px #008cff,

        0 0 30px #008cff,

        0 0 60px
        rgba(0,140,255,.5);
}


/* =====================================================
   TÊN
===================================================== */

.info {

    flex: 1;
}


.name {

    font-size: 50px;

    font-weight: bold;

    line-height: 1.05;

    color: #00aaff;

    margin-bottom: 16px;

    text-shadow:

        0 0 8px #0088ff,

        0 0 20px #0088ff,

        0 0 35px
        rgba(0,136,255,.8);
}


.bio {

    color: #999;

    font-size: 20px;

    line-height: 1.5;

    font-style: italic;
}


/* =====================================================
   ICON
===================================================== */

.discord {

    display: flex;

    justify-content: center;

    margin: 20px 0;
}


.discord-icon {

    width: 58px;

    height: 58px;

    border-radius: 50%;

    background: white;

    color: #555;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 27px;

    box-shadow:
        0 0 18px
        rgba(255,255,255,.3);
}


/* =====================================================
   THỐNG KÊ
===================================================== */

.stats {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

    color: #00aaff;

    font-size: 18px;

    margin-bottom: 20px;
}


.separator {

    color: #777;
}


/* =====================================================
   KHU VỰC THUYỀN
===================================================== */

.boat-section {

    position: relative;

    width: 100%;

    height: 220px;

    margin-bottom: 0;

    overflow: hidden;
}


/* ÁNH SÁNG */

.boat-section::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 65px;

    transform:
        translateX(-50%);

    width: 280px;

    height: 75px;

    background:
        rgba(0,140,255,.13);

    border-radius: 50%;

    filter:
        blur(28px);
}


/* =====================================================
   THUYỀN NHỎ
===================================================== */

.sailing-boat {

    position: absolute;

    left: 50%;

    bottom: 32px;

    width: 330px;

    height: 185px;

    transform:
        translateX(-50%);

    animation:
        boatFloat 4s ease-in-out infinite;

    z-index: 5;
}


@keyframes boatFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            rotate(-2deg);
    }

    50% {

        transform:
            translateX(-50%)
            translateY(7px)
            rotate(2deg);
    }

    100% {

        transform:
            translateX(-50%)
            translateY(0)
            rotate(-2deg);
    }
}


/* =====================================================
   CỘT
===================================================== */

.mast {

    position: absolute;

    left: 161px;

    bottom: 47px;

    width: 6px;

    height: 160px;

    background:

        linear-gradient(
            to right,
            #444,
            #fff,
            #555
        );

    border-radius: 5px;

    box-shadow:

        0 0 8px white,

        0 0 15px
        rgba(255,255,255,.5);
}


/* =====================================================
   BUỒM LỚN
===================================================== */

.main-sail {

    position: absolute;

    left: 35px;

    bottom: 67px;

    width: 0;

    height: 0;

    border-right:
        115px solid transparent;

    border-bottom:
        145px solid #f5f5f5;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,.5)
        );
}


/* =====================================================
   BUỒM NHỎ
===================================================== */

.small-sail {

    position: absolute;

    left: 166px;

    bottom: 75px;

    width: 0;

    height: 0;

    border-left:
        72px solid transparent;

    border-bottom:
        100px solid #777;

    filter:
        drop-shadow(
            0 0 8px
            rgba(0,140,255,.6)
        );
}


/* =====================================================
   CỜ
===================================================== */

.flag {

    position: absolute;

    left: 166px;

    top: 0;

    width: 0;

    height: 0;

    border-top:
        10px solid transparent;

    border-bottom:
        10px solid transparent;

    border-left:
        38px solid #00aaff;

    filter:
        drop-shadow(
            0 0 8px #008cff
        );
}


/* =====================================================
   THÂN THUYỀN
===================================================== */

.hull {

    position: absolute;

    left: 8px;

    bottom: 8px;

    width: 315px;

    height: 52px;

    background:

        linear-gradient(
            to bottom,
            #444,
            #151515,
            #000
        );

    clip-path:

        polygon(
            0 0,
            100% 0,
            82% 100%,
            15% 100%
        );

    border-bottom:
        4px solid #008cff;

    box-shadow:

        0 0 12px #008cff,

        0 0 25px
        rgba(0,140,255,.6);
}


/* =====================================================
   MẶT NƯỚC
===================================================== */

.water {

    position: absolute;

    left: -10%;

    bottom: 18px;

    width: 120%;

    height: 75px;

    z-index: 3;

    background:

        repeating-linear-gradient(
            -5deg,
            transparent 0,
            transparent 11px,
            rgba(0,140,255,.35) 13px,
            transparent 16px
        );

    animation:
        waterMove 5s linear infinite;
}


@keyframes waterMove {

    from {
        transform:
            translateX(0);
    }

    to {
        transform:
            translateX(-100px);
    }
}


/* =====================================================
   SÓNG
===================================================== */

.wave {

    position: absolute;

    height: 12px;

    border-top:
        3px solid #008cff;

    border-radius: 50%;

    filter:
        drop-shadow(
            0 0 7px #008cff
        );

    z-index: 10;

    animation:
        waveMove 3s ease-in-out infinite;
}


.wave1 {

    width: 150px;

    left: 0;

    bottom: 25px;
}


.wave2 {

    width: 200px;

    left: 28%;

    bottom: 42px;

    animation-delay: .5s;
}


.wave3 {

    width: 160px;

    right: 0;

    bottom: 23px;

    animation-delay: 1s;
}


@keyframes waveMove {

    0% {

        transform:
            translateX(-18px)
            scaleX(.9);
    }

    50% {

        transform:
            translateX(18px)
            scaleX(1.1);
    }

    100% {

        transform:
            translateX(-18px)
            scaleX(.9);
    }
}


/* =====================================================
   NHẠC
===================================================== */

.song-title {

    font-size: 29px;

    margin-bottom: 15px;
}


.music-controls {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 9px;
}


.time {

    width: 38px;

    flex-shrink: 0;

    text-align: center;

    font-size: 14px;
}


.progress {

    flex: 1;

    height: 9px;

    background: #777;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;
}


.progress-bar {

    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;
}


.buttons {

    display: flex;

    align-items: center;

    gap: 7px;
}


.music-btn {

    width: 38px;

    height: 38px;

    border: none;

    background: transparent;

    color: white;

    font-size: 22px;

    cursor: pointer;
}


.play-btn {

    width: 56px;

    height: 56px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 21px;

    cursor: pointer;

    transition: .2s;
}


.play-btn:hover {

    transform:
        scale(1.08);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .container {

        padding:
            25px 18px 40px;
    }


    .top {

        margin-bottom:
            65px;
    }


    .top button {

        width: 55px;

        height: 55px;

        font-size: 25px;
    }


    .profile {

        gap: 14px;
    }


    .avatar {

        width: 120px;

        height: 120px;

        border-radius: 28px;
    }


    .name {

        font-size: 32px;
    }


    .bio {

        font-size: 14px;
    }


    .stats {

        font-size: 14px;

        gap: 7px;
    }


    /* THUYỀN NHỎ TRÊN ĐIỆN THOẠI */

    .boat-section {

        height: 195px;
    }


    .sailing-boat {

        width: 330px;

        height: 185px;

        bottom: 25px;

        transform:
            translateX(-50%)
            scale(.72);
    }


    .song-title {

        font-size: 25px;
    }


    .music-controls {

        gap: 4px;
    }


    .time {

        width: 30px;

        font-size: 11px;
    }


    .music-btn {

        width: 30px;

        font-size: 17px;
    }


    .play-btn {

        width: 48px;

        height: 48px;

        font-size: 18px;
    }

}


/* =====================================================
   ĐIỆN THOẠI NHỎ
===================================================== */

@media (max-width: 420px) {

    .avatar {

        width: 100px;

        height: 100px;
    }


    .name {

        font-size: 28px;
    }


    .bio {

        font-size: 12px;
    }


    .stats {

        font-size: 13px;

        gap: 5px;
    }


    .sailing-boat {

        transform:
            translateX(-50%)
            scale(.62);
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CANVAS SAO 3D
===================================================== -->

<canvas id="starfield"></canvas>



<div class="container">


    <!-- =================================================
         NÚT
    ================================================= -->

    <div class="top">


        <button
            id="volumeBtn"
            onclick="toggleMusic()">

            🔊

        </button>


        <button
            onclick="likeProfile()">

            ♥

        </button>


    </div>



    <!-- =================================================
         PROFILE
    ================================================= -->

    <div class="profile">


        <img
            class="avatar"
            src="avatar.jpeg"
            alt="Mai Văn Thế"
        >


        <div class="info">


            <div class="name">

                Mai Văn Thế

            </div>


            <div class="bio">

                All difficulties will pass, like the way the shower runs throuh the window!

            </div>


        </div>


    </div>



    <!-- =================================================
         ICON
    ================================================= -->

    <div class="discord">

        <div class="discord-icon">

            ☯

        </div>

    </div>



    <!-- =================================================
         THỐNG KÊ
    ================================================= -->

    <div class="stats">


        <b>

            💙 100K

        </b>


        <span class="separator">

            |

        </span>


        <b>

            ◉ 14/3

        </b>


        <span class="separator">

            |

        </span>


        <b>

            📍 Hà Nội

        </b>


    </div>



    <!-- =================================================
         THUYỀN
    ================================================= -->

    <div class="boat-section">


        <div class="sailing-boat">


            <div class="flag"></div>


            <div class="main-sail"></div>


            <div class="small-sail"></div>


            <div class="mast"></div>


            <div class="hull"></div>


        </div>


        <div class="water"></div>


        <div class="wave wave1"></div>

        <div class="wave wave2"></div>

        <div class="wave wave3"></div>


    </div>



    <!-- =================================================
         NHẠC
    ================================================= -->

    <div class="song-title">

        Promise

    </div>


    <div class="music-controls">


        <span
            class="time"
            id="currentTime">

            0:00

        </span>


        <div
            class="progress"
            onclick="seekMusic(event)">


            <div
                class="progress-bar"
                id="progressBar">

            </div>


        </div>


        <span
            class="time"
            id="duration">

            0:00

        </span>


        <div class="buttons">


            <button
                class="music-btn"
                onclick="previousSong()">

                ⏮

            </button>


            <button
                class="play-btn"
                id="playBtn"
                onclick="toggleMusic()">

                ▶

            </button>


            <button
                class="music-btn"
                onclick="nextSong()">

                ⏭

            </button>


        </div>


    </div>


</div>



<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="audio"
    src="Promise.mp3">
</audio>



<script>

/* =====================================================
   CANVAS SAO 3D
===================================================== */

const canvas =
    document.getElementById(
        "starfield"
    );

const ctx =
    canvas.getContext("2d");


let width;
let height;

let centerX;
let centerY;

let stars = [];


/*
    Số lượng sao
*/

const STAR_COUNT = 600;


/*
    Tốc độ
*/

const STAR_SPEED = 3;


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    centerX =
        width / 2;

    centerY =
        height / 2;
}


/* =====================================================
   TẠO SAO
===================================================== */

function createStars() {

    stars = [];


    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {

        stars.push({

            x:
                (Math.random() - .5)
                * width
                * 2,

            y:
                (Math.random() - .5)
                * height
                * 2,

            z:
                Math.random()
                * width,

            oldX: 0,

            oldY: 0

        });

    }

}


/* =====================================================
   VẼ SAO
===================================================== */

function drawStars() {

    /*
        Xóa nhẹ để tạo đuôi sao
    */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    for (
        let i = 0;
        i < stars.length;
        i++
    ) {

        const star =
            stars[i];


        const oldX =
            star.oldX;

        const oldY =
            star.oldY;


        /*
            Sao tiến về phía người xem
        */

        star.z -= STAR_SPEED;


        /*
            Sao ra khỏi màn hình
            thì tạo lại phía xa
        */

        if (
            star.z <= 1
        ) {

            star.x =
                (Math.random() - .5)
                * width
                * 2;

            star.y =
                (Math.random() - .5)
                * height
                * 2;

            star.z =
                width;

        }


        /*
            Chiếu 3D -> 2D
        */

        const screenX =

            centerX +

            (
                star.x /
                star.z
            ) * 256;


        const screenY =

            centerY +

            (
                star.y /
                star.z
            ) * 256;


        /*
            Kích thước sao
        */

        const size =

            Math.max(
                .5,
                (
                    1 -
                    star.z / width
                ) * 3
            );


        /*
            Đuôi chuyển động
        */

        if (

            oldX > 0 &&
            oldX < width &&
            oldY > 0 &&
            oldY < height

        ) {

            ctx.beginPath();


            ctx.moveTo(
                oldX,
                oldY
            );


            ctx.lineTo(
                screenX,
                screenY
            );


            ctx.strokeStyle =
                "rgba(160,220,255,.75)";


            ctx.lineWidth =
                size;


            ctx.stroke();

        }


        /*
            Vẽ điểm sao
        */

        ctx.beginPath();


        ctx.arc(

            screenX,
            screenY,
            size,
            0,
            Math.PI * 2

        );


        ctx.fillStyle =
            "rgba(255,255,255,.95)";


        ctx.fill();


        /*
            Lưu vị trí
        */

        star.oldX =
            screenX;

        star.oldY =
            screenY;

    }


    requestAnimationFrame(
        drawStars
    );

}


/* =====================================================
   KHỞI ĐỘNG CANVAS
===================================================== */

window.addEventListener(
    "resize",
    function() {

        resizeCanvas();

        createStars();

    }
);


resizeCanvas();

createStars();

drawStars();



/* =====================================================
   AUDIO
===================================================== */

const audio =
    document.getElementById(
        "audio"
    );


const playBtn =
    document.getElementById(
        "playBtn"
    );


const volumeBtn =
    document.getElementById(
        "volumeBtn"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const currentTime =
    document.getElementById(
        "currentTime"
    );


const duration =
    document.getElementById(
        "duration"
    );


/* =====================================================
   PLAY / PAUSE
===================================================== */

function toggleMusic() {

    if (
        audio.paused
    ) {

        audio.play();

        playBtn.innerHTML =
            "Ⅱ";

        volumeBtn.innerHTML =
            "🔊";

    }

    else {

        audio.pause();

        playBtn.innerHTML =
            "▶";

        volumeBtn.innerHTML =
            "🔇";

    }

}


/* =====================================================
   LOAD NHẠC
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.innerHTML =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   THANH NHẠC
===================================================== */

audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !audio.duration
        ) {

            return;

        }


        const percent =

            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.style.width =
            percent + "%";


        currentTime.innerHTML =
            formatTime(
                audio.currentTime
            );

    }
);


/* =====================================================
   HẾT NHẠC
===================================================== */

audio.addEventListener(
    "ended",
    function() {

        playBtn.innerHTML =
            "▶";

        volumeBtn.innerHTML =
            "🔊";

        progressBar.style.width =
            "0%";

        currentTime.innerHTML =
            "0:00";

    }
);


/* =====================================================
   TUA NHẠC
===================================================== */

function seekMusic(event) {

    if (
        !audio.duration
    ) {

        return;

    }


    const rect =
        event.currentTarget
        .getBoundingClientRect();


    const percent =

        (
            event.clientX -
            rect.left
        )
        /
        rect.width;


    audio.currentTime =

        percent *
        audio.duration;

}


/* =====================================================
   BÀI TRƯỚC
===================================================== */

function previousSong() {

    audio.currentTime =
        0;

}


/* =====================================================
   BÀI TIẾP
===================================================== */

function nextSong() {

    audio.currentTime =
        0;

    audio.play();

    playBtn.innerHTML =
        "Ⅱ";

    volumeBtn.innerHTML =
        "🔊";

}


/* =====================================================
   FORMAT THỜI GIAN
===================================================== */

function formatTime(
    seconds
) {

    if (
        isNaN(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsLeft =

        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return (

        minutes +
        ":" +
        secondsLeft

    );

}


/* =====================================================
   LIKE
===================================================== */

function likeProfile() {

    /*
        Chỉ hiệu ứng nút,
        không thay đổi 100K
    */

    const button =
        event.currentTarget;

    button.style.transform =
        "scale(1.2)";


    setTimeout(
        function() {

            button.style.transform =
                "";

        },
        150
    );

}

</script>

</body>
</html>
