<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mai Văn Thế</title>

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* ================= SAO 3D ================= */

        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: -10;
            pointer-events: none;
        }


        /* ================= KHUNG CHÍNH ================= */

        .container {
            position: relative;
            width: 100%;
            max-width: 720px;
            min-height: 100vh;
            margin: auto;
            padding: 30px 25px 50px;
            z-index: 2;
        }


        /* ================= NÚT TRÊN ================= */

        .top {
            display: flex;
            gap: 12px;
            margin-bottom: 70px;
        }

        .top button {
            width: 60px;
            height: 60px;

            border: none;
            border-radius: 16px;

            background: rgba(15, 15, 15, .92);

            color: white;
            font-size: 27px;

            cursor: pointer;

            transition: .2s;
        }

        .top button:hover {
            transform: scale(1.06);
        }


        /* ================= PROFILE ================= */

        .profile {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 25px;
        }


        /* ================= AVATAR ================= */

        .avatar {
            width: 180px;
            height: 180px;

            flex-shrink: 0;

            display: block;
            object-fit: cover;

            border-radius: 35px;

            background: #111;

            box-shadow:
                0 0 12px #008cff,
                0 0 30px #008cff,
                0 0 60px rgba(0, 140, 255, .5);
        }


        /* ================= THÔNG TIN ================= */

        .info {
            flex: 1;
        }

        .name {
            font-size: 50px;
            font-weight: bold;

            line-height: 1.05;

            color: #00aaff;

            margin-bottom: 16px;

            text-shadow:
                0 0 8px #0088ff,
                0 0 20px #0088ff,
                0 0 35px rgba(0, 136, 255, .8);
        }

        .bio {
            color: #999;

            font-size: 20px;
            line-height: 1.5;

            font-style: italic;
        }


        /* ================= THỐNG KÊ ================= */

        .stats {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 14px;

            color: #00aaff;

            font-size: 18px;

            margin-top: 15px;
            margin-bottom: 0;
        }

        .separator {
            color: #777;
        }


        /* ================= KHU VỰC THUYỀN ================= */

        .boat-section {
            position: relative;

            width: 100%;
            height: 180px;

            overflow: hidden;

            margin-top: 5px;
            margin-bottom: 0;
        }


        /* ================= ÁNH SÁNG DƯỚI THUYỀN ================= */

        .boat-section::before {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            width: 230px;
            height: 60px;

            background: rgba(0, 140, 255, .15);

            border-radius: 50%;

            filter: blur(25px);
        }


        /* ================= THUYỀN ================= */

        .sailing-boat {
            position: absolute;

            left: 50%;
            bottom: 25px;

            width: 280px;
            height: 155px;

            transform: translateX(-50%);

            animation: boatFloat 4s ease-in-out infinite;

            z-index: 5;
        }


        @keyframes boatFloat {

            0% {
                transform:
                    translateX(-50%)
                    translateY(0)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateX(-50%)
                    translateY(5px)
                    rotate(2deg);
            }

            100% {
                transform:
                    translateX(-50%)
                    translateY(0)
                    rotate(-2deg);
            }

        }


        /* ================= CỘT BUỒM ================= */

        .mast {
            position: absolute;

            left: 137px;
            bottom: 38px;

            width: 5px;
            height: 135px;

            background:
                linear-gradient(
                    to right,
                    #444,
                    #fff,
                    #555
                );

            border-radius: 5px;

            box-shadow:
                0 0 7px white;
        }


        /* ================= BUỒM LỚN ================= */

        .main-sail {
            position: absolute;

            left: 30px;
            bottom: 55px;

            width: 0;
            height: 0;

            border-right: 95px solid transparent;
            border-bottom: 120px solid #f5f5f5;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 255, 255, .5)
                );
        }


        /* ================= BUỒM NHỎ ================= */

        .small-sail {
            position: absolute;

            left: 141px;
            bottom: 63px;

            width: 0;
            height: 0;

            border-left: 60px solid transparent;
            border-bottom: 82px solid #777;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(0, 140, 255, .6)
                );
        }


        /* ================= CỜ ================= */

        .flag {
            position: absolute;

            left: 142px;
            top: 0;

            width: 0;
            height: 0;

            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 32px solid #00aaff;

            filter:
                drop-shadow(
                    0 0 7px #008cff
                );
        }


        /* ================= THÂN THUYỀN ================= */

        .hull {
            position: absolute;

            left: 7px;
            bottom: 6px;

            width: 265px;
            height: 43px;

            background:
                linear-gradient(
                    to bottom,
                    #555,
                    #191919,
                    #000
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    82% 100%,
                    15% 100%
                );

            border-bottom: 3px solid #008cff;

            box-shadow:
                0 0 10px #008cff,
                0 0 20px rgba(0, 140, 255, .5);
        }


        /* ================= NƯỚC ================= */

        .water {
            position: absolute;

            left: -10%;
            bottom: 10px;

            width: 120%;
            height: 55px;

            z-index: 3;

            background:
                repeating-linear-gradient(
                    -5deg,
                    transparent 0,
                    transparent 10px,
                    rgba(0, 140, 255, .32) 12px,
                    transparent 15px
                );

            animation:
                waterMove 5s linear infinite;
        }


        @keyframes waterMove {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100px);
            }

        }


        /* ================= SÓNG ================= */

        .wave {
            position: absolute;

            height: 10px;

            border-top: 2px solid #008cff;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 0 6px #008cff
                );

            z-index: 10;

            animation:
                waveMove 3s ease-in-out infinite;
        }

        .wave1 {
            width: 120px;
            left: 5%;
            bottom: 18px;
        }

        .wave2 {
            width: 170px;
            left: 37%;
            bottom: 30px;
            animation-delay: .5s;
        }

        .wave3 {
            width: 130px;
            right: 5%;
            bottom: 18px;
            animation-delay: 1s;
        }


        @keyframes waveMove {

            0% {
                transform:
                    translateX(-15px)
                    scaleX(.9);
            }

            50% {
                transform:
                    translateX(15px)
                    scaleX(1.1);
            }

            100% {
                transform:
                    translateX(-15px)
                    scaleX(.9);
            }

        }


        /* ================= NHẠC ================= */

        .song-title {
            font-size: 29px;
            margin-bottom: 15px;
        }

        .music-controls {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 9px;
        }

        .time {
            width: 38px;

            flex-shrink: 0;

            text-align: center;

            font-size: 14px;
        }

        .progress {
            flex: 1;

            height: 9px;

            background: #777;

            border-radius: 20px;

            overflow: hidden;

            cursor: pointer;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background: white;

            border-radius: 20px;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .music-btn {
            width: 38px;
            height: 38px;

            border: none;

            background: transparent;

            color: white;

            font-size: 22px;

            cursor: pointer;
        }

        .play-btn {
            width: 56px;
            height: 56px;

            border: none;
            border-radius: 50%;

            background: white;

            color: black;

            font-size: 21px;

            cursor: pointer;

            transition: .2s;
        }

        .play-btn:hover {
            transform: scale(1.08);
        }


        /* ================= HIỆU ỨNG NÚT TIM ================= */

        .heart-btn {
            transition:
                transform .2s,
                color .2s,
                box-shadow .2s;
        }

        .heart-btn:hover {
            color: #00aaff;

            box-shadow:
                0 0 10px #008cff,
                0 0 25px rgba(0, 140, 255, .5);
        }

        .heart-btn:active {
            transform: scale(1.25);
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .container {
                padding: 25px 18px 40px;
            }

            .top {
                margin-bottom: 60px;
            }

            .top button {
                width: 55px;
                height: 55px;
                font-size: 25px;
            }

            .profile {
                gap: 14px;
            }

            .avatar {
                width: 120px;
                height: 120px;

                border-radius: 28px;
            }

            .name {
                font-size: 32px;
            }

            .bio {
                font-size: 14px;
            }

            .stats {
                font-size: 14px;
                gap: 7px;
                margin-top: 15px;
            }

            .boat-section {
                height: 150px;
            }

            .sailing-boat {
                bottom: 5px;

                transform:
                    translateX(-50%)
                    scale(.58);
            }

            .song-title {
                font-size: 25px;
            }

            .music-controls {
                gap: 4px;
            }

            .time {
                width: 30px;
                font-size: 11px;
            }

            .music-btn {
                width: 30px;
                font-size: 17px;
            }

            .play-btn {
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
        }


        /* ================= MOBILE NHỎ ================= */

        @media (max-width: 420px) {

            .avatar {
                width: 100px;
                height: 100px;
            }

            .name {
                font-size: 28px;
            }

            .bio {
                font-size: 12px;
            }

            .stats {
                font-size: 13px;
                gap: 5px;
            }

            .sailing-boat {
                transform:
                    translateX(-50%)
                    scale(.48);
            }
        }

    </style>

</head>


<body>

    <!-- ================= SAO 3D ================= -->

    <canvas id="starfield"></canvas>


    <div class="container">


        <!-- ================= NÚT TRÊN ================= -->

        <div class="top">

            <button
                id="volumeBtn"
                onclick="toggleMusic()">
                🔊
            </button>


            <!-- NÚT TRÁI TIM -->

            <button
                class="heart-btn"
                onclick="goToLovePage(this)">
                ♥
            </button>

        </div>


        <!-- ================= PROFILE ================= -->

        <div class="profile">

            <img
                class="avatar"
                src="avatar.jpeg"
                alt="Mai Văn Thế"
            >

            <div class="info">

                <div class="name">
                    Mai Văn Thế
                </div>

                <div class="bio">
                    All difficulties will pass, like the way the shower runs through the window!
                </div>

            </div>

        </div>


        <!-- ================= THỐNG KÊ ================= -->

        <div class="stats">

            <b>💙 100K</b>

            <span class="separator">|</span>

            <b>◉ 14/3</b>

            <span class="separator">|</span>

            <b>📍 Hà Nội</b>

        </div>


        <!-- ================= THUYỀN ================= -->

        <div class="boat-section">

            <div class="sailing-boat">

                <div class="flag"></div>

                <div class="main-sail"></div>

                <div class="small-sail"></div>

                <div class="mast"></div>

                <div class="hull"></div>

            </div>

            <div class="water"></div>

            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>

        </div>


        <!-- ================= NHẠC ================= -->

        <div class="song-title">
            Promise
        </div>


        <div class="music-controls">

            <span
                class="time"
                id="currentTime">
                0:00
            </span>


            <div
                class="progress"
                onclick="seekMusic(event)">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>


            <span
                class="time"
                id="duration">
                0:00
            </span>


            <div class="buttons">

                <button
                    class="music-btn"
                    onclick="previousSong()">
                    ⏮
                </button>


                <button
                    class="play-btn"
                    id="playBtn"
                    onclick="toggleMusic()">
                    ▶
                </button>


                <button
                    class="music-btn"
                    onclick="nextSong()">
                    ⏭
                </button>

            </div>

        </div>

    </div>


    <!-- ================= FILE NHẠC ================= -->

    <audio
        id="audio"
        src="Promise.mp3">
    </audio>


    <script>


        /* ================= SAO 3D ================= */

        const canvas =
            document.getElementById("starfield");

        const ctx =
            canvas.getContext("2d");


        let width;
        let height;

        let centerX;
        let centerY;

        let stars = [];


        const STAR_COUNT = 600;

        const STAR_SPEED = 3;


        /* ================= RESIZE ================= */

        function resizeCanvas() {

            width =
                canvas.width =
                window.innerWidth;

            height =
                canvas.height =
                window.innerHeight;

            centerX =
                width / 2;

            centerY =
                height / 2;
        }


        /* ================= TẠO SAO ================= */

        function createStars() {

            stars = [];

            for (
                let i = 0;
                i < STAR_COUNT;
                i++
            ) {

                stars.push({

                    x:
                        (Math.random() - .5)
                        * width * 2,

                    y:
                        (Math.random() - .5)
                        * height * 2,

                    z:
                        Math.random()
                        * width,

                    oldX: 0,

                    oldY: 0

                });

            }

        }


        /* ================= VẼ SAO ================= */

        function drawStars() {

            ctx.fillStyle =
                "rgba(0,0,0,.35)";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            for (
                let i = 0;
                i < stars.length;
                i++
            ) {

                const star =
                    stars[i];

                const oldX =
                    star.oldX;

                const oldY =
                    star.oldY;


                star.z -= STAR_SPEED;


                if (star.z <= 1) {

                    star.x =
                        (Math.random() - .5)
                        * width * 2;

                    star.y =
                        (Math.random() - .5)
                        * height * 2;

                    star.z =
                        width;
                }


                const screenX =
                    centerX +
                    (star.x / star.z) * 256;


                const screenY =
                    centerY +
                    (star.y / star.z) * 256;


                const size =
                    Math.max(
                        .5,
                        (1 - star.z / width) * 3
                    );


                /* ĐUÔI SAO */

                if (
                    oldX > 0 &&
                    oldX < width &&
                    oldY > 0 &&
                    oldY < height
                ) {

                    ctx.beginPath();

                    ctx.moveTo(
                        oldX,
                        oldY
                    );

                    ctx.lineTo(
                        screenX,
                        screenY
                    );

                    ctx.strokeStyle =
                        "rgba(160,220,255,.75)";

                    ctx.lineWidth =
                        size;

                    ctx.stroke();
                }


                /* ĐIỂM SAO */

                ctx.beginPath();

                ctx.arc(
                    screenX,
                    screenY,
                    size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "rgba(255,255,255,.95)";

                ctx.fill();


                star.oldX =
                    screenX;

                star.oldY =
                    screenY;
            }


            requestAnimationFrame(
                drawStars
            );
        }


        window.addEventListener(
            "resize",
            function() {

                resizeCanvas();

                createStars();

            }
        );


        resizeCanvas();

        createStars();

        drawStars();



        /* ================= NHẠC ================= */

        const audio =
            document.getElementById("audio");

        const playBtn =
            document.getElementById("playBtn");

        const volumeBtn =
            document.getElementById("volumeBtn");

        const progressBar =
            document.getElementById("progressBar");

        const currentTime =
            document.getElementById("currentTime");

        const duration =
            document.getElementById("duration");


        /* ================= PLAY / PAUSE ================= */

        function toggleMusic() {

            if (audio.paused) {

                audio.play();

                playBtn.innerHTML =
                    "Ⅱ";

                volumeBtn.innerHTML =
                    "🔊";

            } else {

                audio.pause();

                playBtn.innerHTML =
                    "▶";

                volumeBtn.innerHTML =
                    "🔇";
            }

        }


        /* ================= LẤY THỜI LƯỢNG ================= */

        audio.addEventListener(
            "loadedmetadata",
            function() {

                duration.innerHTML =
                    formatTime(
                        audio.duration
                    );

            }
        );


        /* ================= CẬP NHẬT THANH NHẠC ================= */

        audio.addEventListener(
            "timeupdate",
            function() {

                if (!audio.duration) {
                    return;
                }


                const percent =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;


                progressBar.style.width =
                    percent + "%";


                currentTime.innerHTML =
                    formatTime(
                        audio.currentTime
                    );

            }
        );


        /* ================= HẾT BÀI ================= */

        audio.addEventListener(
            "ended",
            function() {

                playBtn.innerHTML =
                    "▶";

                volumeBtn.innerHTML =
                    "🔊";

                progressBar.style.width =
                    "0%";

                currentTime.innerHTML =
                    "0:00";

            }
        );


        /* ================= TUA NHẠC ================= */

        function seekMusic(event) {

            if (!audio.duration) {
                return;
            }


            const rect =
                event.currentTarget
                .getBoundingClientRect();


            const percent =
                (
                    event.clientX -
                    rect.left
                ) / rect.width;


            audio.currentTime =
                percent *
                audio.duration;
        }


        /* ================= QUAY VỀ ĐẦU ================= */

        function previousSong() {

            audio.currentTime = 0;

        }


        /* ================= PHÁT LẠI ================= */

        function nextSong() {

            audio.currentTime = 0;

            audio.play();

            playBtn.innerHTML =
                "Ⅱ";

            volumeBtn.innerHTML =
                "🔊";

        }


        /* ================= ĐỊNH DẠNG THỜI GIAN ================= */

        function formatTime(seconds) {

            if (isNaN(seconds)) {
                return "0:00";
            }


            const minutes =
                Math.floor(
                    seconds / 60
                );


            const secondsLeft =
                Math.floor(
                    seconds % 60
                )
                .toString()
                .padStart(2, "0");


            return (
                minutes +
                ":" +
                secondsLeft
            );

        }


        /* ================= CHUYỂN TRANG BẰNG TRÁI TIM ================= */

        function goToLovePage(button) {

            /* Hiệu ứng nhấn */

            button.style.transform =
                "scale(1.3)";

            button.style.color =
                "#00aaff";


            /* Chờ hiệu ứng rồi chuyển trang */

            setTimeout(function() {

                window.location.href =
                    "love.html";

            }, 250);

        }

    </script>

</body>

</html>
