<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mai Văn Thế</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* ================= NỀN SAO ================= */

.stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #000;

    background-image:
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 1.5px, transparent 2.5px),
        radial-gradient(circle, white 1px, transparent 2px);

    background-size:
        85px 85px,
        135px 135px,
        190px 190px,
        260px 260px;

    background-position:
        10px 20px,
        40px 80px,
        100px 30px,
        150px 120px;

    animation: starsMove 25s linear infinite;
}

@keyframes starsMove {
    from {
        background-position:
            10px 20px,
            40px 80px,
            100px 30px,
            150px 120px;
    }

    to {
        background-position:
            80px 100px,
            120px 150px,
            180px 100px,
            230px 200px;
    }
}

/* ================= CONTAINER ================= */

.container {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;

    margin: auto;

    padding: 35px 25px 70px;
}

/* ================= NÚT TRÊN ================= */

.top-buttons {
    display: flex;
    gap: 12px;

    margin-bottom: 90px;
}

.top-button {
    width: 60px;
    height: 60px;

    border: none;
    border-radius: 16px;

    background: rgba(15, 15, 15, 0.9);

    color: white;

    font-size: 28px;

    cursor: pointer;

    transition: 0.2s;
}

.top-button:hover {
    transform: scale(1.06);
    background: #1a1a1a;
}

/* ================= PROFILE ================= */

.profile {
    display: flex;
    align-items: center;

    gap: 25px;

    margin-bottom: 25px;
}

/* ẢNH */

.avatar {
    width: 180px;
    height: 180px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 35px;

    display: block;

    box-shadow:
        0 0 12px #008cff,
        0 0 30px #008cff,
        0 0 55px rgba(0, 140, 255, 0.45);
}

/* THÔNG TIN */

.info {
    flex: 1;
}

.name {
    color: #00aaff;

    font-size: 52px;

    font-weight: 700;

    line-height: 1.05;

    margin-bottom: 18px;

    text-shadow:
        0 0 8px #0088ff,
        0 0 20px #0088ff,
        0 0 35px rgba(0, 136, 255, 0.7);
}

.bio {
    color: #999;

    font-size: 20px;

    line-height: 1.5;

    font-style: italic;
}

/* ================= DISCORD ================= */

.discord {
    display: flex;
    justify-content: center;

    margin-top: 25px;
    margin-bottom: 25px;
}

.discord-icon {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;

    color: #555;

    border-radius: 50%;

    font-size: 27px;

    box-shadow:
        0 0 15px rgba(255,255,255,0.25);
}

/* ================= THÔNG TIN ================= */

.stats {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 14px;

    margin-bottom: 60px;

    font-size: 18px;

    color: #00aaff;
}

.stats .separator {
    color: #777;
}

.stats .location {
    color: #00aaff;
}

/* ================= MUSIC ================= */

.music {
    width: 100%;
}

/* Tên bài */

.song-title {
    font-size: 29px;

    font-weight: 500;

    margin-bottom: 16px;
}

/* Thanh điều khiển */

.music-controls {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 10px;
}

/* Thời gian */

.time {
    width: 38px;

    flex-shrink: 0;

    text-align: center;

    font-size: 14px;

    color: white;
}

/* Thanh tiến trình */

.progress-container {
    flex: 1;

    height: 8px;

    background: #777;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;
}

.progress-bar {
    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;

    transition: width 0.1s linear;
}

/* Nút nhạc */

.music-buttons {
    display: flex;
    align-items: center;

    gap: 8px;
}

.music-button {
    width: 40px;
    height: 40px;

    border: none;

    background: transparent;

    color: white;

    font-size: 23px;

    cursor: pointer;
}

.play-button {
    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 22px;

    cursor: pointer;

    transition: 0.2s;
}

.play-button:hover {
    transform: scale(1.08);
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .container {
        padding: 25px 20px 50px;
    }

    .top-buttons {
        margin-bottom: 75px;
    }

    .top-button {
        width: 55px;
        height: 55px;

        font-size: 25px;
    }

    .profile {
        gap: 17px;
    }

    .avatar {
        width: 135px;
        height: 135px;

        border-radius: 28px;
    }

    .name {
        font-size: 39px;
    }

    .bio {
        font-size: 16px;
    }

    .discord-icon {
        width: 54px;
        height: 54px;
    }

    .stats {
        font-size: 16px;

        gap: 9px;

        margin-bottom: 50px;
    }

    .song-title {
        font-size: 25px;
    }

    .music-controls {
        gap: 5px;
    }

    .time {
        width: 32px;

        font-size: 12px;
    }

    .music-button {
        width: 32px;

        font-size: 19px;
    }

    .play-button {
        width: 50px;
        height: 50px;

        font-size: 19px;
    }
}

/* ================= ĐIỆN THOẠI NHỎ ================= */

@media (max-width: 420px) {

    .avatar {
        width: 110px;
        height: 110px;
    }

    .name {
        font-size: 32px;
    }

    .bio {
        font-size: 14px;
    }

    .stats {
        font-size: 14px;
    }

    .song-title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

    <!-- ================= NÚT TRÊN ================= -->

    <div class="top-buttons">

        <button
            class="top-button"
            id="volumeButton"
            onclick="toggleMusic()">
            🔊
        </button>

        <button
            class="top-button"
            onclick="likeProfile()">
            ♥
        </button>

    </div>


    <!-- ================= PROFILE ================= -->

    <div class="profile">

        <!-- FILE TRONG GITHUB CỦA BẠN -->
        <img
            src="avatar.jpeg"
            alt="Mai Văn Thế"
            class="avatar"
        >

        <div class="info">

            <div class="name">
                Mai Văn Thế
            </div>

            <div class="bio">
                Between her and money, I choose money!
            </div>

        </div>

    </div>


    <!-- ================= DISCORD ================= -->

    <div class="discord">

        <div class="discord-icon">
            ☯
        </div>

    </div>


    <!-- ================= THÔNG TIN ================= -->

    <div class="stats">

        <b>
            ♥ <span id="likes">1</span>
        </b>

        <span class="separator">
            |
        </span>

        <b>
            ◉ 87
        </b>

        <span class="separator">
            |
        </span>

        <b class="location">
            Hà Nội
        </b>

    </div>


    <!-- ================= MUSIC ================= -->

    <div class="music">

        <div class="song-title">
            Promise
        </div>


        <div class="music-controls">

            <span
                class="time"
                id="currentTime">
                0:00
            </span>


            <div
                class="progress-container"
                onclick="seekMusic(event)">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>


            <span
                class="time"
                id="duration">
                0:00
            </span>


            <div class="music-buttons">

                <button
                    class="music-button"
                    onclick="previousSong()">
                    ⏮
                </button>


                <button
                    class="play-button"
                    id="playButton"
                    onclick="toggleMusic()">
                    ▶
                </button>


                <button
                    class="music-button"
                    onclick="nextSong()">
                    ⏭
                </button>

            </div>

        </div>

    </div>

</div>


<!-- ================= AUDIO ================= -->

<audio
    id="audio"
    src="Promise.mp3">
</audio>


<script>

/* ================= LẤY ELEMENT ================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const volumeButton =
    document.getElementById("volumeButton");

const progressBar =
    document.getElementById("progressBar");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");


/* ================= PLAY / PAUSE ================= */

function toggleMusic() {

    if (audio.paused) {

        audio.play();

        playButton.innerHTML = "Ⅱ";

        volumeButton.innerHTML = "🔊";

    } else {

        audio.pause();

        playButton.innerHTML = "▶";

        volumeButton.innerHTML = "🔇";

    }
}


/* ================= THỜI LƯỢNG ================= */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.innerHTML =
            formatTime(audio.duration);

    }
);


/* ================= THANH NHẠC ================= */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) {
            return;
        }

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progressBar.style.width =
            percent + "%";

        currentTime.innerHTML =
            formatTime(audio.currentTime);

    }
);


/* ================= KẾT THÚC ================= */

audio.addEventListener(
    "ended",
    function() {

        playButton.innerHTML = "▶";

        volumeButton.innerHTML = "🔊";

        progressBar.style.width = "0%";

        currentTime.innerHTML = "0:00";

    }
);


/* ================= CLICK THANH NHẠC ================= */

function seekMusic(event) {

    if (!audio.duration) {
        return;
    }

    const rect =
        event.currentTarget.getBoundingClientRect();

    const position =
        event.clientX - rect.left;

    const percent =
        position / rect.width;

    audio.currentTime =
        percent * audio.duration;

}


/* ================= PREVIOUS ================= */

function previousSong() {

    audio.currentTime = 0;

}


/* ================= NEXT ================= */

function nextSong() {

    audio.currentTime = 0;

    audio.play();

    playButton.innerHTML = "Ⅱ";

    volumeButton.innerHTML = "🔊";

}


/* ================= FORMAT TIME ================= */

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsLeft =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + secondsLeft;

}


/* ================= LIKE ================= */

function likeProfile() {

    const likes =
        document.getElementById("likes");

    let number =
        parseInt(likes.innerText);

    number++;

    likes.innerText =
        number;

}

</script>

</body>
</html>
