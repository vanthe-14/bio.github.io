<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Văn Thế</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; }
        body { background: #000; color: white; font-family: Arial, Helvetica, sans-serif; overflow-x: hidden; transition: background 1.2s ease; }
        .time-status { position: fixed; top: 18px; right: 22px; z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; padding: 10px 14px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(8,8,15,.58); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.25); pointer-events: none; text-align: right; }
        .time-display { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        .greeting-display { font-size: 12px; color: rgba(255,255,255,.78); }
        body.morning { background: radial-gradient(circle at 50% 0%, #182544 0%, #080c18 42%, #000 78%); }
        body.afternoon { background: radial-gradient(circle at 50% 0%, #101e34 0%, #050b16 42%, #000 78%); }
        body.evening { background: radial-gradient(circle at 50% 0%, #211734 0%, #0b0917 42%, #000 78%); }
        body.night { background: radial-gradient(circle at 50% 0%, #080f27 0%, #030611 45%, #000 80%); }
        body.morning .time-status { background: rgba(255,194,94,.14); border-color: rgba(255,212,138,.35); }
        body.afternoon .time-status { background: rgba(0,140,255,.14); border-color: rgba(0,170,255,.35); }
        body.evening .time-status { background: rgba(92,54,170,.16); border-color: rgba(160,132,255,.34); }
        body.night .time-status { background: rgba(12,20,45,.62); border-color: rgba(130,170,255,.28); }
        #starfield { position: fixed; inset: 0; width: 100%; height: 100%; background: transparent; z-index: -10; pointer-events: none; }
        .container { position: relative; width: 100%; max-width: 720px; min-height: 100vh; margin: auto; padding: 30px 25px 50px; z-index: 2; }
        .top { display: flex; gap: 12px; margin-bottom: 70px; }
        .top button { width: 60px; height: 60px; border: none; border-radius: 16px; background: rgba(15,15,15,.92); color: white; font-size: 27px; cursor: pointer; transition: .2s; }
        .top button:hover { transform: scale(1.06); }
        .profile { display: flex; align-items: center; gap: 24px; margin-bottom: 25px; }
        .avatar { width: 180px; height: 180px; flex-shrink: 0; display: block; object-fit: cover; border-radius: 35px; background: #111; box-shadow: 0 0 12px #008cff, 0 0 30px #008cff, 0 0 60px rgba(0,140,255,.5); }
        .info { flex: 1; }
        .name { font-size: 50px; font-weight: bold; line-height: 1.05; color: #00aaff; margin-bottom: 16px; text-shadow: 0 0 8px #0088ff, 0 0 20px #0088ff, 0 0 35px rgba(0,136,255,.8); }
        .bio { color: #999; font-size: 20px; line-height: 1.5; font-style: italic; min-height: 1.5em; white-space: normal; overflow: hidden; }
        .bio.typing::after { content: "|"; display: inline-block; margin-left: 2px; color: #00aaff; animation: blinkCursor .75s steps(1) infinite; }
        @keyframes blinkCursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .stats { display: flex; justify-content: center; align-items: center; gap: 14px; color: #00aaff; font-size: 18px; margin-top: 15px; }
        .separator { color: #777; }
        .boat-section { position: relative; width: 100%; height: 180px; overflow: hidden; margin-top: 5px; }
        .boat-section::before { content: ""; position: absolute; left: 50%; bottom: 25px; transform: translateX(-50%); width: 230px; height: 60px; background: rgba(0,140,255,.15); border-radius: 50%; filter: blur(25px); }
        .sailing-boat { position: absolute; left: 50%; bottom: 25px; width: 280px; height: 155px; transform: translateX(-50%); animation: boatFloat 4s ease-in-out infinite; z-index: 5; }
        @keyframes boatFloat { 0% { transform: translateX(-50%) translateY(0) rotate(-2deg); } 50% { transform: translateX(-50%) translateY(5px) rotate(2deg); } 100% { transform: translateX(-50%) translateY(0) rotate(-2deg); } }
        .mast { position: absolute; left: 137px; bottom: 38px; width: 5px; height: 135px; background: linear-gradient(to right,#444,#fff,#555); border-radius: 5px; box-shadow: 0 0 7px white; }
        .main-sail { position: absolute; left: 30px; bottom: 55px; width: 0; height: 0; border-right: 95px solid transparent; border-bottom: 120px solid #f5f5f5; filter: drop-shadow(0 0 8px rgba(255,255,255,.5)); }
        .small-sail { position: absolute; left: 141px; bottom: 63px; width: 0; height: 0; border-left: 60px solid transparent; border-bottom: 82px solid #777; filter: drop-shadow(0 0 7px rgba(0,140,255,.6)); }
        .flag { position: absolute; left: 142px; top: 0; width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 32px solid #00aaff; filter: drop-shadow(0 0 7px #008cff); }
        .hull { position: absolute; left: 7px; bottom: 6px; width: 265px; height: 43px; background: linear-gradient(to bottom,#555,#191919,#000); clip-path: polygon(0 0,100% 0,82% 100%,15% 100%); border-bottom: 3px solid #008cff; box-shadow: 0 0 10px #008cff,0 0 20px rgba(0,140,255,.5); }
        .water { position: absolute; left: -10%; bottom: 10px; width: 120%; height: 55px; z-index: 3; background: repeating-linear-gradient(-5deg,transparent 0,transparent 10px,rgba(0,140,255,.32) 12px,transparent 15px); animation: waterMove 5s linear infinite; }
        @keyframes waterMove { from { transform: translateX(0); } to { transform: translateX(-100px); } }
        .wave { position: absolute; height: 10px; border-top: 2px solid #008cff; border-radius: 50%; filter: drop-shadow(0 0 6px #008cff); z-index: 10; animation: waveMove 3s ease-in-out infinite; }
        .wave1 { width: 120px; left: 5%; bottom: 18px; }
        .wave2 { width: 170px; left: 37%; bottom: 30px; animation-delay: .5s; }
        .wave3 { width: 130px; right: 5%; bottom: 18px; animation-delay: 1s; }
        @keyframes waveMove { 0% { transform: translateX(-15px) scaleX(.9); } 50% { transform: translateX(15px) scaleX(1.1); } 100% { transform: translateX(-15px) scaleX(.9); } }
        .song-title { font-size: 29px; margin-bottom: 15px; }
        .music-controls { width: 100%; display: flex; align-items: center; gap: 9px; }
        .time { width: 38px; flex-shrink: 0; text-align: center; font-size: 14px; }
        .progress { flex: 1; height: 9px; background: #777; border-radius: 20px; overflow: hidden; cursor: pointer; }
        .progress-bar { width: 0%; height: 100%; background: white; border-radius: 20px; }
        .buttons { display: flex; align-items: center; gap: 7px; }
        .music-btn { width: 38px; height: 38px; border: none; background: transparent; color: white; font-size: 22px; cursor: pointer; }
        .play-btn { width: 56px; height: 56px; border: none; border-radius: 50%; background: white; color: black; font-size: 21px; cursor: pointer; transition: .2s; }
        .play-btn:hover { transform: scale(1.08); }
        .volume-btn { border-radius: 12px; transition: .2s; }
        .volume-btn:hover { color: #00aaff; background: rgba(0,140,255,.12); box-shadow: 0 0 10px rgba(0,140,255,.35); }
        .game-btn { transition: transform .2s, color .2s, box-shadow .2s; }
        .game-btn:hover { color: #00aaff; box-shadow: 0 0 10px #008cff,0 0 25px rgba(0,140,255,.5); }
        .game-btn:active { transform: scale(1.15); }
        @media (max-width: 600px) {
            .time-status { top: 12px; right: 12px; padding: 8px 11px; }
            .time-display { font-size: 15px; }
            .greeting-display { font-size: 10px; }
            .container { padding: 25px 18px 40px; }
            .top { margin-bottom: 60px; }
            .top button { width: 55px; height: 55px; font-size: 25px; }
            .profile { gap: 14px; }
            .avatar { width: 120px; height: 120px; border-radius: 28px; }
            .name { font-size: 32px; }
            .bio { font-size: 14px; }
            .stats { font-size: 14px; gap: 7px; margin-top: 15px; }
            .boat-section { height: 150px; }
            .sailing-boat { bottom: 5px; transform: translateX(-50%) scale(.58); }
            .song-title { font-size: 25px; }
            .music-controls { gap: 4px; }
            .time { width: 30px; font-size: 11px; }
            .music-btn { width: 30px; font-size: 17px; }
            .play-btn { width: 48px; height: 48px; font-size: 18px; }
        }
        @media (max-width: 420px) {
            .avatar { width: 100px; height: 100px; }
            .name { font-size: 28px; }
            .bio { font-size: 12px; }
            .stats { font-size: 13px; gap: 5px; }
            .sailing-boat { transform: translateX(-50%) scale(.48); }
        }
    </style>
</head>
<body>
    <div class="time-status" aria-live="polite">
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <div class="greeting-display" id="greetingDisplay">Chào bạn 👋</div>
    </div>
    <canvas id="starfield"></canvas>
    <div class="container">
        <div class="top">
            <button class="game-btn" onclick="goToLovePage(this)" aria-label="Mở game rắn săn mồi">🎮</button>
        </div>
        <div class="profile">
            <img class="avatar" src="avatar.jpeg" alt="Mai Văn Thế">
            <div class="info">
                <div class="name">Mai Văn Thế</div>
                <div class="bio typing" id="bioText"></div>
            </div>
        </div>
        <div class="stats">
            <b>💙 100K</b><span class="separator">|</span><b>◉ 14/3</b><span class="separator">|</span><b>📍 Hà Nội</b>
        </div>
        <div class="boat-section">
            <div class="sailing-boat">
                <div class="flag"></div><div class="main-sail"></div><div class="small-sail"></div><div class="mast"></div><div class="hull"></div>
            </div>
            <div class="water"></div>
            <div class="wave wave1"></div><div class="wave wave2"></div><div class="wave wave3"></div>
        </div>
        <div class="song-title">Promise</div>
        <div class="music-controls">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress" onclick="seekMusic(event)"><div class="progress-bar" id="progressBar"></div></div>
            <span class="time" id="duration">0:00</span>
            <div class="buttons">
                <button class="music-btn" onclick="previousSong()" aria-label="Bài trước">⏮</button>
                <button class="play-btn" id="playBtn" onclick="toggleMusic()" aria-label="Phát hoặc tạm dừng">▶</button>
                <button class="music-btn" onclick="nextSong()" aria-label="Bài tiếp">⏭</button>
                <button class="music-btn volume-btn" id="volumeBtn" onclick="toggleMusic()" aria-label="Bật hoặc tắt nhạc">🔊</button>
            </div>
        </div>
    </div>
    <audio id="audio" src="Promise.mp3"></audio>
    <script>
        const timeDisplay = document.getElementById("timeDisplay");
        const greetingDisplay = document.getElementById("greetingDisplay");
        function updateTimeStatus() {
            const now = new Date(); const hour = now.getHours();
            timeDisplay.textContent = now.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
            let greeting, periodClass;
            if (hour >= 5 && hour < 12) { greeting = "Chào buổi sáng ☀️"; periodClass = "morning"; }
            else if (hour >= 12 && hour < 18) { greeting = "Chào buổi chiều 🌤️"; periodClass = "afternoon"; }
            else if (hour >= 18 && hour < 22) { greeting = "Chào buổi tối 🌆"; periodClass = "evening"; }
            else { greeting = "Chúc bạn ngủ ngon 🌙"; periodClass = "night"; }
            greetingDisplay.textContent = greeting;
            document.body.classList.remove("morning", "afternoon", "evening", "night"); document.body.classList.add(periodClass);
        }
        updateTimeStatus(); setInterval(updateTimeStatus, 1000);

        const bioText = document.getElementById("bioText");
        const bioMessage = "All difficulties will pass, like the way the shower runs through the window!";
        let bioIndex = 0;
        function typeBio() {
            bioText.textContent = bioMessage.slice(0, bioIndex);
            if (bioIndex < bioMessage.length) { bioIndex++; setTimeout(typeBio, bioMessage[bioIndex - 1] === " " ? 120 : 55); }
            else { setTimeout(() => { bioIndex = 0; typeBio(); }, 3500); }
        }
        typeBio();

        const canvas = document.getElementById("starfield"); const ctx = canvas.getContext("2d");
        let width, height, centerX, centerY, stars = []; const STAR_COUNT = 600; const STAR_SPEED = 3;
        function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; centerX = width / 2; centerY = height / 2; }
        function createStars() { stars = []; for (let i = 0; i < STAR_COUNT; i++) stars.push({ x: (Math.random() - .5) * width * 2, y: (Math.random() - .5) * height * 2, z: Math.random() * width, oldX: 0, oldY: 0 }); }
        function drawStars() {
            ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0,0,width,height);
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i], oldX = star.oldX, oldY = star.oldY; star.z -= STAR_SPEED;
                if (star.z <= 1) { star.x = (Math.random() - .5) * width * 2; star.y = (Math.random() - .5) * height * 2; star.z = width; }
                const screenX = centerX + (star.x / star.z) * 256, screenY = centerY + (star.y / star.z) * 256, size = Math.max(.5, (1 - star.z / width) * 3);
                if (oldX > 0 && oldX < width && oldY > 0 && oldY < height) { ctx.beginPath(); ctx.moveTo(oldX, oldY); ctx.lineTo(screenX, screenY); ctx.strokeStyle = "rgba(160,220,255,.75)"; ctx.lineWidth = size; ctx.stroke(); }
                ctx.beginPath(); ctx.arc(screenX, screenY, size, 0, Math.PI * 2); ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.fill(); star.oldX = screenX; star.oldY = screenY;
            }
            requestAnimationFrame(drawStars);
        }
        window.addEventListener("resize", function() { resizeCanvas(); createStars(); }); resizeCanvas(); createStars(); drawStars();

        const audio = document.getElementById("audio"); const playBtn = document.getElementById("playBtn"); const volumeBtn = document.getElementById("volumeBtn"); const progressBar = document.getElementById("progressBar"); const currentTime = document.getElementById("currentTime"); const duration = document.getElementById("duration");
        function toggleMusic() { if (audio.paused) { audio.play(); playBtn.innerHTML = "Ⅱ"; volumeBtn.innerHTML = "🔊"; } else { audio.pause(); playBtn.innerHTML = "▶"; volumeBtn.innerHTML = "🔇"; } }
        audio.addEventListener("loadedmetadata", function() { duration.innerHTML = formatTime(audio.duration); });
        audio.addEventListener("timeupdate", function() { if (!audio.duration) return; progressBar.style.width = ((audio.currentTime / audio.duration) * 100) + "%"; currentTime.innerHTML = formatTime(audio.currentTime); });
        audio.addEventListener("ended", function() { playBtn.innerHTML = "▶"; volumeBtn.innerHTML = "🔊"; progressBar.style.width = "0%"; currentTime.innerHTML = "0:00"; });
        function seekMusic(event) { if (!audio.duration) return; const rect = event.currentTarget.getBoundingClientRect(); audio.currentTime = ((event.clientX - rect.left) / rect.width) * audio.duration; }
        function previousSong() { audio.currentTime = 0; }
        function nextSong() { audio.currentTime = 0; audio.play(); playBtn.innerHTML = "Ⅱ"; volumeBtn.innerHTML = "🔊"; }
        function formatTime(seconds) { if (isNaN(seconds)) return "0:00"; const minutes = Math.floor(seconds / 60); const secondsLeft = Math.floor(seconds % 60).toString().padStart(2, "0"); return minutes + ":" + secondsLeft; }
        function goToLovePage(button) { button.style.transform = "scale(1.15)"; button.style.color = "#00aaff"; setTimeout(function() { window.location.href = "love.html"; }, 250); }
    </script>
</body>
</html>
