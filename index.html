<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mai Văn Thế</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* ================= NỀN SAO ================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;

    background-color: #000;

    background-image:
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 1.5px, transparent 2px),
        radial-gradient(circle, white 1px, transparent 2px);

    background-size:
        90px 90px,
        140px 140px,
        200px 200px,
        270px 270px;

    background-position:
        10px 20px,
        50px 80px,
        100px 30px,
        150px 120px;

    animation: stars 25s linear infinite;
}

@keyframes stars {
    from {
        background-position:
            10px 20px,
            50px 80px,
            100px 30px,
            150px 120px;
    }

    to {
        background-position:
            100px 120px,
            150px 180px,
            200px 100px,
            250px 220px;
    }
}

/* ================= CONTAINER ================= */

.container {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;

    margin: auto;

    padding: 30px 25px 60px;
}

/* ================= NÚT TRÊN ================= */

.top {
    display: flex;
    gap: 12px;

    margin-bottom: 90px;
}

.top button {
    width: 60px;
    height: 60px;

    border: none;
    border-radius: 16px;

    background: rgba(15,15,15,0.9);

    color: white;

    font-size: 28px;

    cursor: pointer;
}

/* ================= PROFILE ================= */

.profile {
    display: flex;
    align-items: center;

    gap: 25px;

    margin-bottom: 30px;
}

/* ================= AVATAR ================= */

.avatar {
    width: 180px;
    height: 180px;

    flex-shrink: 0;

    display: block;

    object-fit: cover;

    border-radius: 35px;

    background: #111;

    box-shadow:
        0 0 12px #008cff,
        0 0 30px #008cff,
        0 0 60px rgba(0,140,255,0.5);
}

/* ================= THÔNG TIN ================= */

.info {
    flex: 1;
}

.name {
    font-size: 50px;

    font-weight: bold;

    line-height: 1.05;

    color: #00aaff;

    margin-bottom: 18px;

    text-shadow:
        0 0 8px #0088ff,
        0 0 20px #0088ff,
        0 0 35px rgba(0,136,255,0.8);
}

.bio {
    color: #999;

    font-size: 20px;

    line-height: 1.5;

    font-style: italic;
}

/* ================= DISCORD ================= */

.discord {
    display: flex;
    justify-content: center;

    margin: 25px 0;
}

.discord-icon {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: white;

    color: #555;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;

    box-shadow:
        0 0 18px rgba(255,255,255,0.3);
}

/* ================= STATS ================= */

.stats {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 14px;

    margin-bottom: 60px;

    font-size: 18px;

    color: #00aaff;
}

.separator {
    color: #777;
}

/* ================= MUSIC ================= */

.song-title {
    font-size: 29px;

    margin-bottom: 16px;
}

.music-controls {
    display: flex;
    align-items: center;

    gap: 10px;
}

.time {
    width: 38px;

    flex-shrink: 0;

    text-align: center;

    font-size: 14px;
}

.progress {
    flex: 1;

    height: 8px;

    background: #777;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;
}

.progress-bar {
    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;
}

.buttons {
    display: flex;
    align-items: center;

    gap: 8px;
}

.music-btn {
    width: 40px;
    height: 40px;

    border: none;

    background: transparent;

    color: white;

    font-size: 23px;

    cursor: pointer;
}

.play-btn {
    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 22px;

    cursor: pointer;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .container {
        padding: 25px 18px 50px;
    }

    .top {
        margin-bottom: 70px;
    }

    .top button {
        width: 55px;
        height: 55px;

        font-size: 25px;
    }

    .profile {
        gap: 15px;
    }

    .avatar {
        width: 125px;
        height: 125px;

        border-radius: 28px;
    }

    .name {
        font-size: 35px;
    }

    .bio {
        font-size: 15px;
    }

    .stats {
        font-size: 15px;

        gap: 8px;

        margin-bottom: 50px;
    }

    .song-title {
        font-size: 25px;
    }

    .music-controls {
        gap: 5px;
    }

    .time {
        width: 32px;
        font-size: 12px;
    }

    .music-btn {
        width: 32px;
        font-size: 18px;
    }

    .play-btn {
        width: 50px;
        height: 50px;

        font-size: 19px;
    }
}

/* ================= ĐIỆN THOẠI NHỎ ================= */

@media (max-width: 420px) {

    .avatar {
        width: 105px;
        height: 105px;
    }

    .name {
        font-size: 30px;
    }

    .bio {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- NÚT -->

    <div class="top">

        <button id="volumeBtn" onclick="toggleMusic()">
            🔊
        </button>

        <button onclick="likeProfile()">
            ♥
        </button>

    </div>


    <!-- PROFILE -->

    <div class="profile">

        <!--
        ẢNH LẤY TRỰC TIẾP TỪ GITHUB
        -->

        <img
            class="avatar"
            src="https://raw.githubusercontent.com/vanthe-14/vanthe.github.io/main/avatar.jpeg"
            alt="Mai Văn Thế"
        >

        <div class="info">

            <div class="name">
                Mai Văn Thế
            </div>

            <div class="bio">
                Between her and money, I choose money!
            </div>

        </div>

    </div>


    <!-- DISCORD -->

    <div class="discord">

        <div class="discord-icon">
            ☯
        </div>

    </div>


    <!-- THỐNG KÊ -->

    <div class="stats">

        <b>
            ♥ <span id="likes">100000</span>
        </b>

        <span class="separator">
            |
        </span>

        <b>
            ◉ 14/3
        </b>

        <span class="separator">
            |
        </span>

        <b>
            Hà Nội
        </b>

    </div>


    <!-- NHẠC -->

    <div class="song-title">
        Promise
    </div>


    <div class="music-controls">

        <span
            class="time"
            id="currentTime">
            0:00
        </span>


        <div
            class="progress"
            onclick="seekMusic(event)">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>


        <span
            class="time"
            id="duration">
            0:00
        </span>


        <div class="buttons">

            <button
                class="music-btn"
                onclick="previousSong()">
                ⏮
            </button>


            <button
                class="play-btn"
                id="playBtn"
                onclick="toggleMusic()">
                ▶
            </button>


            <button
                class="music-btn"
                onclick="nextSong()">
                ⏭
            </button>

        </div>

    </div>

</div>


<!-- ================= NHẠC ================= -->

<audio
    id="audio"
    src="Promise.mp3">
</audio>


<script>

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const volumeBtn =
    document.getElementById("volumeBtn");

const progressBar =
    document.getElementById("progressBar");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");


/* PLAY / PAUSE */

function toggleMusic() {

    if (audio.paused) {

        audio.play();

        playBtn.innerHTML = "Ⅱ";

        volumeBtn.innerHTML = "🔊";

    } else {

        audio.pause();

        playBtn.innerHTML = "▶";

        volumeBtn.innerHTML = "🔇";

    }

}


/* THỜI LƯỢNG */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.innerHTML =
            formatTime(audio.duration);

    }
);


/* TIẾN TRÌNH */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) {
            return;
        }

        let percent =
            (audio.currentTime /
            audio.duration) * 100;

        progressBar.style.width =
            percent + "%";

        currentTime.innerHTML =
            formatTime(audio.currentTime);

    }
);


/* KẾT THÚC */

audio.addEventListener(
    "ended",
    function() {

        playBtn.innerHTML = "▶";

        volumeBtn.innerHTML = "🔊";

        progressBar.style.width = "0%";

        currentTime.innerHTML = "0:00";

    }
);


/* CLICK THANH NHẠC */

function seekMusic(event) {

    if (!audio.duration) {
        return;
    }

    const rect =
        event.currentTarget
        .getBoundingClientRect();

    const position =
        event.clientX - rect.left;

    const percent =
        position / rect.width;

    audio.currentTime =
        percent * audio.duration;

}


/* PREVIOUS */

function previousSong() {

    audio.currentTime = 0;

}


/* NEXT */

function nextSong() {

    audio.currentTime = 0;

    audio.play();

    playBtn.innerHTML = "Ⅱ";

    volumeBtn.innerHTML = "🔊";

}


/* FORMAT TIME */

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsLeft =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + secondsLeft;

}


/* LIKE */

function likeProfile() {

    const likes =
        document.getElementById("likes");

    likes.innerHTML =
        parseInt(likes.innerHTML) + 1;

}

</script>

</body>
</html>
