<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mai Văn Thế</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;transition:background 1.2s ease}
.time-status{position:fixed;top:18px;right:22px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:10px 14px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(8,8,15,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.25);pointer-events:none;text-align:right}
.time-display{font-size:18px;font-weight:700;letter-spacing:1px}.greeting-display{font-size:12px;color:rgba(255,255,255,.78)}
body.morning{background:radial-gradient(circle at 50% 0%,#182544 0%,#080c18 42%,#000 78%)}
body.afternoon{background:radial-gradient(circle at 50% 0%,#101e34 0%,#050b16 42%,#000 78%)}
body.evening{background:radial-gradient(circle at 50% 0%,#211734 0%,#0b0917 42%,#000 78%)}
body.night{background:radial-gradient(circle at 50% 0%,#080f27 0%,#030611 45%,#000 80%)}
body.morning .time-status{background:rgba(255,194,94,.14);border-color:rgba(255,212,138,.35)}
body.afternoon .time-status{background:rgba(0,140,255,.14);border-color:rgba(0,170,255,.35)}
body.evening .time-status{background:rgba(92,54,170,.16);border-color:rgba(160,132,255,.34)}
body.night .time-status{background:rgba(12,20,45,.62);border-color:rgba(130,170,255,.28)}
#starfield{position:fixed;inset:0;width:100%;height:100%;background:transparent;z-index:-10;pointer-events:none}
.container{position:relative;width:100%;max-width:720px;min-height:100vh;margin:auto;padding:30px 25px 50px;z-index:2}
.top{display:flex;gap:12px;margin-bottom:70px}.top button{width:60px;height:60px;border:none;border-radius:16px;background:rgba(15,15,15,.92);color:#fff;font-size:27px;cursor:pointer;transition:.2s}.top button:hover{transform:scale(1.06)}
.volume-top{border-radius:12px;transition:.2s}.volume-top:hover{color:#00aaff;background:rgba(0,140,255,.12);box-shadow:0 0 10px rgba(0,140,255,.35)}
.profile{display:flex;align-items:center;gap:24px;margin-bottom:25px}.avatar{width:180px;height:180px;flex-shrink:0;display:block;object-fit:cover;border-radius:35px;background:#111;box-shadow:0 0 12px #008cff,0 0 30px #008cff,0 0 60px rgba(0,140,255,.5)}
.info{flex:1}.name{font-size:50px;font-weight:bold;line-height:1.05;color:#00aaff;margin-bottom:16px;text-shadow:0 0 8px #0088ff,0 0 20px #0088ff,0 0 35px rgba(0,136,255,.8)}
.bio{color:#999;font-size:20px;line-height:1.5;font-style:italic;min-height:1.5em;white-space:normal;overflow:hidden}.bio.typing::after{content:"|";display:inline-block;margin-left:2px;color:#00aaff;animation:blinkCursor .75s steps(1) infinite}@keyframes blinkCursor{0%,50%{opacity:1}51%,100%{opacity:0}}
.stats{display:flex;justify-content:center;align-items:center;gap:14px;color:#00aaff;font-size:18px;margin-top:15px}.separator{color:#777}.view-counter{display:inline-flex;align-items:center;gap:8px}.view-counter-icon{font-size:22px;line-height:1}.view-count-number{min-width:2ch}
.boat-section{position:relative;width:100%;height:230px;overflow:hidden;margin-top:5px}.boat-section::before{content:"";position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:300px;height:70px;background:rgba(0,140,255,.15);border-radius:50%;filter:blur(25px)}
.sailing-boat{position:absolute;left:50%;bottom:18px;width:330px;height:210px;transform:translateX(-50%);animation:pirateBoatFloat 4s ease-in-out infinite;z-index:8}
@keyframes pirateBoatFloat{0%{transform:translateX(-50%) translateY(0) rotate(-3deg)}25%{transform:translateX(-50%) translateY(-5px) rotate(1deg)}50%{transform:translateX(-50%) translateY(5px) rotate(4deg)}75%{transform:translateX(-50%) translateY(-4px) rotate(0deg)}100%{transform:translateX(-50%) translateY(0) rotate(-3deg)}}
.ship-mast{position:absolute;width:7px;border-radius:5px;background:linear-gradient(90deg,#211008,#8a572d,#d29b5d,#3b1b0b);box-shadow:2px 0 4px rgba(0,0,0,.45);z-index:10}.mast-main{left:158px;bottom:58px;height:165px}.mast-left{left:82px;bottom:70px;height:135px;transform:rotate(-5deg)}.mast-right{left:237px;bottom:67px;height:130px;transform:rotate(5deg)}
.pirate-sail{position:absolute;background:linear-gradient(135deg,#263b3c,#526b64 45%,#182628);filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));overflow:hidden;transform-origin:top center;animation:sailMove 2.8s ease-in-out infinite alternate}.sail-left{left:38px;bottom:103px;width:100px;height:78px;clip-path:polygon(0 0,100% 8%,88% 100%,8% 83%)}.sail-center{left:102px;bottom:108px;width:120px;height:100px;clip-path:polygon(0 0,100% 5%,88% 100%,8% 88%);animation-delay:.4s}.sail-right{left:181px;bottom:106px;width:105px;height:86px;clip-path:polygon(0 5%,100% 0,92% 90%,10% 100%);animation-delay:.7s}@keyframes sailMove{from{transform:skewX(0deg) scaleX(1)}to{transform:skewX(-3deg) scaleX(.96)}}
.skull{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;color:rgba(225,230,215,.85);text-shadow:0 2px 4px rgba(0,0,0,.7)}
.top-sail{position:absolute;left:122px;bottom:172px;width:76px;height:50px;background:linear-gradient(135deg,#293c3d,#60746b,#1c2829);clip-path:polygon(0 0,100% 10%,88% 100%,12% 82%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));animation:topSailMove 2.4s ease-in-out infinite alternate}.top-sail span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;color:rgba(235,235,220,.8)}@keyframes topSailMove{from{transform:skewX(0)}to{transform:skewX(-5deg)}}
.pirate-flag{position:absolute;left:164px;top:5px;width:52px;height:31px;display:flex;align-items:center;justify-content:center;color:white;font-size:17px;background:linear-gradient(135deg,#080b0b,#293636);clip-path:polygon(0 0,100% 20%,78% 50%,100% 80%,0 100%);transform-origin:left center;animation:flagMove .8s ease-in-out infinite alternate;z-index:20}@keyframes flagMove{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.ship-rope{position:absolute;height:2px;background:rgba(225,205,160,.7);transform-origin:left center;z-index:7}.rope-a{width:150px;left:160px;bottom:215px;transform:rotate(145deg)}.rope-b{width:150px;left:162px;bottom:214px;transform:rotate(35deg)}.rope-c{width:245px;left:43px;bottom:112px;transform:rotate(-2deg)}.rope-d{width:125px;left:160px;bottom:211px;transform:rotate(82deg)}
.ship-deck{position:absolute;left:45px;bottom:58px;width:240px;height:23px;border-radius:50% 50% 5px 5px;background:linear-gradient(180deg,#a87543,#51311c);box-shadow:inset 0 -5px 7px rgba(0,0,0,.35);z-index:5}.ship-cabin{position:absolute;left:188px;bottom:75px;width:70px;height:38px;border-radius:6px 6px 2px 2px;background:linear-gradient(#654329,#2b1a11);border:2px solid #9b6a3b;z-index:6}.cabin-window{position:absolute;left:10px;top:9px;width:16px;height:13px;border-radius:3px;background:linear-gradient(135deg,#e1f6f0,#428c94);border:1px solid #c79c62;box-shadow:0 0 5px rgba(110,220,230,.4)}.cabin-window.second{left:40px}
.ship-hull{position:absolute;left:25px;bottom:10px;width:280px;height:58px;background:linear-gradient(180deg,#49382b,#1d2526 55%,#080d0e);clip-path:polygon(0 0,100% 0,86% 58%,72% 90%,57% 100%,17% 92%,7% 55%);border-bottom:4px solid #070b0c;box-shadow:0 7px 12px rgba(0,0,0,.55);z-index:8}.hull-line{position:absolute;left:35px;width:210px;height:2px;background:rgba(166,125,78,.6);transform:rotate(-3deg)}.line1{top:15px}.line2{top:29px;opacity:.65}.line3{top:42px;opacity:.4}.ship-bow{position:absolute;right:8px;bottom:30px;width:40px;height:45px;background:linear-gradient(135deg,#6d4b2d,#1b1713);clip-path:polygon(0 0,100% 35%,45% 100%,0 80%);z-index:9}.ship-wake{position:absolute;left:-45px;bottom:7px;width:150px;height:30px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.85),transparent 70%);filter:blur(4px);animation:wakePulse 1.3s ease-in-out infinite alternate}@keyframes wakePulse{from{transform:scaleX(.65);opacity:.3}to{transform:scaleX(1.35);opacity:.8}}
.water{position:absolute;left:-10%;bottom:8px;width:120%;height:55px;z-index:3;background:repeating-linear-gradient(-5deg,transparent 0,transparent 10px,rgba(0,140,255,.32) 12px,transparent 15px);animation:waterMove 5s linear infinite}@keyframes waterMove{from{transform:translateX(0)}to{transform:translateX(-100px)}}.wave{position:absolute;height:10px;border-top:2px solid #008cff;border-radius:50%;filter:drop-shadow(0 0 6px #008cff);z-index:10;animation:waveMove 3s ease-in-out infinite}.wave1{width:120px;left:5%;bottom:18px}.wave2{width:170px;left:37%;bottom:30px;animation-delay:.5s}.wave3{width:130px;right:5%;bottom:18px;animation-delay:1s}@keyframes waveMove{0%{transform:translateX(-15px) scaleX(.9)}50%{transform:translateX(15px) scaleX(1.1)}100%{transform:translateX(-15px) scaleX(.9)}}
.song-title{font-size:29px;margin-bottom:15px}.music-controls{width:100%;display:flex;align-items:center;gap:9px}.time{width:38px;flex-shrink:0;text-align:center;font-size:14px}.progress{flex:1;height:9px;background:#777;border-radius:20px;overflow:hidden;cursor:pointer}.progress-bar{width:0%;height:100%;background:#fff;border-radius:20px}.buttons{display:flex;align-items:center;gap:7px}.music-btn{width:38px;height:38px;border:none;background:transparent;color:#fff;font-size:22px;cursor:pointer}.play-btn{width:56px;height:56px;border:none;border-radius:50%;background:#fff;color:#000;font-size:21px;cursor:pointer;transition:.2s}.play-btn:hover{transform:scale(1.08)}
.game-wide{display:flex;width:100%;height:56px;align-items:center;justify-content:center;margin-top:22px;border:1px solid rgba(0,170,255,.35);border-radius:16px;background:linear-gradient(135deg,rgba(0,140,255,.16),rgba(0,70,140,.22));color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:.25s;box-shadow:0 0 15px rgba(0,140,255,.08)}.game-wide:hover{transform:translateY(-2px);color:#00c8ff;border-color:#00aaff;box-shadow:0 0 18px rgba(0,140,255,.35),0 0 35px rgba(0,140,255,.12)}.game-wide:active{transform:scale(.98)}
@media(max-width:600px){.time-status{top:12px;right:12px;padding:8px 11px}.time-display{font-size:15px}.greeting-display{font-size:10px}.container{padding:25px 18px 40px}.top{margin-bottom:60px}.top button{width:55px;height:55px;font-size:25px}.profile{gap:14px}.avatar{width:120px;height:120px;border-radius:28px}.name{font-size:32px}.bio{font-size:14px}.stats{font-size:14px;gap:7px;margin-top:15px}.view-counter-icon{font-size:18px}.boat-section{height:210px}.sailing-boat{bottom:5px;transform:translateX(-50%) scale(.58)}.song-title{font-size:25px}.music-controls{gap:4px}.time{width:30px;font-size:11px}.music-btn{width:30px;font-size:17px}.play-btn{width:48px;height:48px;font-size:18px}.game-wide{height:52px;font-size:15px;margin-top:18px}}
@media(max-width:420px){.avatar{width:100px;height:100px}.name{font-size:28px}.bio{font-size:12px}.stats{font-size:13px;gap:5px}.view-counter-icon{font-size:17px}.sailing-boat{transform:translateX(-50%) scale(.48)}}
</style>
</head>
<body>
<div class="time-status" aria-live="polite"><div class="time-display" id="timeDisplay">00:00:00</div><div class="greeting-display" id="greetingDisplay">Chào bạn 👋</div></div>
<canvas id="starfield"></canvas>
<div class="container">
<div class="top"><button class="volume-top" id="volumeTop" onclick="toggleMusic()" aria-label="Bật hoặc tắt nhạc">🔊</button></div>
<div class="profile"><img class="avatar" src="avatar.jpeg" alt="Mai Văn Thế"><div class="info"><div class="name">Mai Văn Thế</div><div class="bio typing" id="bioText"></div></div></div>
<div class="stats"><b class="view-counter" title="Số lượt xem"><span class="view-counter-icon">👁️</span><span class="view-count-number" id="viewCount">0</span></b><span class="separator">|</span><b>◉ 14/3</b><span class="separator">|</span><b>📍 Hà Nội</b></div>
<div class="boat-section"><div class="sailing-boat"><div class="ship-mast mast-main"></div><div class="ship-mast mast-left"></div><div class="ship-mast mast-right"></div><div class="pirate-sail sail-left"><span class="skull">☠</span></div><div class="pirate-sail sail-center"><span class="skull">☠</span></div><div class="pirate-sail sail-right"><span class="skull">☠</span></div><div class="top-sail"><span>☠</span></div><div class="pirate-flag">☠</div><div class="ship-rope rope-a"></div><div class="ship-rope rope-b"></div><div class="ship-rope rope-c"></div><div class="ship-rope rope-d"></div><div class="ship-deck"></div><div class="ship-cabin"><div class="cabin-window"></div><div class="cabin-window second"></div></div><div class="ship-hull"><div class="hull-line line1"></div><div class="hull-line line2"></div><div class="hull-line line3"></div></div><div class="ship-bow"></div><div class="ship-wake"></div></div><div class="water"></div><div class="wave wave1"></div><div class="wave wave2"></div><div class="wave wave3"></div></div>
<div class="song-title">Promise</div>
<div class="music-controls"><span class="time" id="currentTime">0:00</span><div class="progress" onclick="seekMusic(event)"><div class="progress-bar" id="progressBar"></div></div><span class="time" id="duration">0:00</span><div class="buttons"><button class="music-btn" onclick="previousSong()">⏮</button><button class="play-btn" id="playBtn" onclick="toggleMusic()">▶</button><button class="music-btn" onclick="nextSong()">⏭</button></div></div>
<button class="game-wide" onclick="goToLovePage(this)" aria-label="Mở game rắn săn mồi">🎮 &nbsp; CHƠI GAME RẮN SĂN MỒI</button>
</div>
<audio id="audio" src="Promise.mp3"></audio>
<script>
const timeDisplay=document.getElementById("timeDisplay"),greetingDisplay=document.getElementById("greetingDisplay");
function updateTimeStatus(){const now=new Date(),hour=now.getHours();timeDisplay.textContent=now.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});let greeting,periodClass;if(hour>=5&&hour<12){greeting="Chào buổi sáng ☀️";periodClass="morning"}else if(hour>=12&&hour<18){greeting="Chào buổi chiều 🌤️";periodClass="afternoon"}else if(hour>=18&&hour<22){greeting="Chào buổi tối 🌆";periodClass="evening"}else{greeting="Chúc bạn ngủ ngon 🌙";periodClass="night"}greetingDisplay.textContent=greeting;document.body.classList.remove("morning","afternoon","evening","night");document.body.classList.add(periodClass)}
updateTimeStatus();setInterval(updateTimeStatus,1000);
const bioText=document.getElementById("bioText"),bioMessage="All difficulties will pass, like the way the shower runs through the window!";let bioIndex=0;function typeBio(){bioText.textContent=bioMessage.slice(0,bioIndex);if(bioIndex<bioMessage.length){bioIndex++;setTimeout(typeBio,bioMessage[bioIndex-1]===" "?120:55)}else{setTimeout(()=>{bioIndex=0;typeBio()},3500)}}typeBio();
const canvas=document.getElementById("starfield"),ctx=canvas.getContext("2d");let width,height,centerX,centerY,stars=[];const STAR_COUNT=600,STAR_SPEED=3;function resizeCanvas(){width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;centerX=width/2;centerY=height/2}function createStars(){stars=[];for(let i=0;i<STAR_COUNT;i++)stars.push({x:(Math.random()-.5)*width*2,y:(Math.random()-.5)*height*2,z:Math.random()*width,oldX:0,oldY:0})}function drawStars(){ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,width,height);for(const star of stars){const oldX=star.oldX,oldY=star.oldY;star.z-=STAR_SPEED;if(star.z<=1){star.x=(Math.random()-.5)*width*2;star.y=(Math.random()-.5)*height*2;star.z=width}const screenX=centerX+(star.x/star.z)*256,screenY=centerY+(star.y/star.z)*256,size=Math.max(.5,(1-star.z/width)*3);if(oldX>0&&oldX<width&&oldY>0&&oldY<height){ctx.beginPath();ctx.moveTo(oldX,oldY);ctx.lineTo(screenX,screenY);ctx.strokeStyle="rgba(160,220,255,.75)";ctx.lineWidth=size;ctx.stroke()}ctx.beginPath();ctx.arc(screenX,screenY,size,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,.95)";ctx.fill();star.oldX=screenX;star.oldY=screenY}requestAnimationFrame(drawStars)}window.addEventListener("resize",()=>{resizeCanvas();createStars()});resizeCanvas();createStars();drawStars();
const audio=document.getElementById("audio"),playBtn=document.getElementById("playBtn"),volumeTop=document.getElementById("volumeTop"),progressBar=document.getElementById("progressBar"),currentTime=document.getElementById("currentTime"),duration=document.getElementById("duration");
function toggleMusic(){if(audio.paused){audio.play();playBtn.innerHTML="Ⅱ";volumeTop.innerHTML="🔊"}else{audio.pause();playBtn.innerHTML="▶";volumeTop.innerHTML="🔇"}}
audio.addEventListener("loadedmetadata",()=>{duration.innerHTML=formatTime(audio.duration)});audio.addEventListener("timeupdate",()=>{if(!audio.duration)return;progressBar.style.width=(audio.currentTime/audio.duration*100)+"%";currentTime.innerHTML=formatTime(audio.currentTime)});audio.addEventListener("ended",()=>{playBtn.innerHTML="▶";volumeTop.innerHTML="🔊";progressBar.style.width="0%";currentTime.innerHTML="0:00"});function seekMusic(event){if(!audio.duration)return;const rect=event.currentTarget.getBoundingClientRect();audio.currentTime=((event.clientX-rect.left)/rect.width)*audio.duration}function previousSong(){audio.currentTime=0}function nextSong(){audio.currentTime=0;audio.play();playBtn.innerHTML="Ⅱ";volumeTop.innerHTML="🔊"}function formatTime(seconds){if(isNaN(seconds))return"0:00";const minutes=Math.floor(seconds/60),secondsLeft=Math.floor(seconds%60).toString().padStart(2,"0");return minutes+":"+secondsLeft}
const viewCountElement=document.getElementById("viewCount"),VIEW_NAMESPACE="vanthe-14-bio",VIEW_KEY="profile-page-views";
function formatViewCount(value){return new Intl.NumberFormat("vi-VN").format(value)}
async function updateViewCount(){try{const response=await fetch(`https://api.counterapi.dev/v1/${VIEW_NAMESPACE}/${VIEW_KEY}/up`,{cache:"no-store"});if(!response.ok)throw new Error("online counter unavailable");const data=await response.json();const count=Number(data.count);if(Number.isFinite(count)){viewCountElement.textContent=formatViewCount(count)}else{throw new Error("invalid counter response")}}catch(error){viewCountElement.textContent="—";console.warn("Không thể cập nhật bộ đếm online.",error)}}
updateViewCount();
function goToLovePage(button){button.style.transform="scale(.98)";button.style.color="#00aaff";setTimeout(()=>{window.open("love.html","_blank","noopener");button.style.transform=""},180)}
</script>
</body>
</html>
